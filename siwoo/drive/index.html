<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무한 드라이브 — 힐링 로드 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
  canvas { display: block; }

  /* ── HUD: 풍경을 가리지 않도록 하단에 얇게 깐다. 흰색 + 반투명으로 통일. */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Malgun Gothic", system-ui, sans-serif;
    color: rgba(255,255,255,.9); text-shadow: 0 1px 6px rgba(0,0,0,.45);
    font-weight: 400; letter-spacing: .02em;
  }
  #bottom {
    position: absolute; left: 0; right: 0; bottom: 26px;
    display: flex; align-items: baseline; justify-content: center; gap: 26px;
  }
  #speed { font-size: 30px; font-weight: 300; line-height: 1; }
  #speed span { font-size: 12px; font-weight: 400; opacity: .6; margin-left: 5px; }
  #info { font-size: 12px; opacity: .55; }
  #info i { font-style: normal; opacity: .45; margin: 0 7px; }
  /* 조작 설명은 시작 후 잠깐만 보이고 사라진다 */
  #help {
    position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
    font-size: 12px; line-height: 1.9; opacity: .6; text-align: center; white-space: nowrap;
    transition: opacity 1.2s ease;
  }
  #help.gone { opacity: 0; }
  kbd { background: rgba(255,255,255,.13); border-radius: 3px; padding: 1px 5px; font-size: 11px; }
  #toast {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%);
    font-size: 13px; opacity: 0; transition: opacity .5s; letter-spacing: .08em;
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-content: center;
    background: #0b1020; color: #dfe6ff; font-family: "Malgun Gothic", sans-serif;
    font-size: 18px; letter-spacing: 2px; z-index: 10; transition: opacity .6s;
  }
</style>
</head>
<body>
<div id="loading">도로를 만드는 중…</div>
<script>
  // 로딩에서 멈추거나 특정 메시만 안 그려질 때 원인을 바로 볼 수 있게 화면에 띄운다
  function showErr(msg) {
    let el = document.getElementById('loading');
    if (!el) { el = document.createElement('div'); el.id = 'loading'; document.body.appendChild(el); }
    el.style.opacity = 1;
    el.style.fontSize = '14px';
    el.style.letterSpacing = '0';
    el.style.padding = '30px';
    el.style.textAlign = 'center';
    el.textContent = '⚠ ' + msg;
  }
  addEventListener('error', e => showErr((e.message || e.error || '스크립트 오류')
    + (e.lineno ? ' (줄 ' + e.lineno + ')' : '')), true);
  addEventListener('unhandledrejection', e => showErr('로드 실패: ' + (e.reason && e.reason.message || e.reason)));
</script>
<div id="hud">
  <div id="help">
    <kbd>W</kbd><kbd>S</kbd> 가속·브레이크 &nbsp; <kbd>A</kbd><kbd>D</kbd> 조향 &nbsp; <kbd>Shift</kbd> 부스트 &nbsp; <kbd>Space</kbd> 정지<br>
    <kbd>C</kbd> 시점 &nbsp; <kbd>R</kbd> 날씨 &nbsp; <kbd>T</kbd> 시간 &nbsp; <kbd>F</kbd> 헤드라이트 &nbsp; <kbd>P</kbd> 화면효과 &nbsp; <kbd>H</kbd> UI
  </div>
  <div id="bottom">
    <div id="speed">0<span>km/h</span></div>
    <div id="info"></div>
  </div>
  <div id="toast"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════
//  바이옴
// ═══════════════════════════════════════════════════════════
// grass = 풀 밀도, conif = 침엽수 비율(나머지는 활엽수)
const BIOMES = [
  { name: '초원',    ground: 0x7a9f57, rock: 0x8d8d80, hill: 1.0, trees: 0.5,  treeTop: 0x4e7f45, treeH: 1.0, haze: 0xbcd2e6, grass: 1.0,  conif: 0.15, cactus: 0    },
  { name: '침엽수림', ground: 0x557a4a, rock: 0x74766c, hill: 1.6, trees: 0.95, treeTop: 0x2c5238, treeH: 1.5, haze: 0xaec6dc, grass: 0.55, conif: 0.9,  cactus: 0    },
  { name: '사막',    ground: 0xcbae7c, rock: 0xb1946a, hill: 0.7, trees: 0.30, treeTop: 0x6f7f4c, treeH: 0.7, haze: 0xdcc8a4, grass: 0.10, conif: 0.0,  cactus: 0.92 },
  { name: '설원',    ground: 0xf4f8fc, rock: 0xc3ccd6, hill: 1.3, trees: 0.38, treeTop: 0x36564b, treeH: 1.2, haze: 0xe6f0f8, grass: 0.10, conif: 0.85, cactus: 0    },
  { name: '해안',    ground: 0x93ac74, rock: 0xa39d90, hill: 0.55, trees: 0.3, treeTop: 0x517f52, treeH: 1.1, haze: 0xc3dcea, grass: 0.7,  conif: 0.2,  cactus: 0    },
];
const BIOME_LEN = 3400;

function biomeAt(z) {
  const f = z / BIOME_LEN;
  const i = Math.floor(f), t = f - i;
  const n = BIOMES.length;
  const a = BIOMES[((i % n) + n) % n];
  const b = BIOMES[(((i + 1) % n) + n) % n];
  return { a, b, k: t * t * (3 - 2 * t) };
}
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _tmp = new THREE.Color();
const WHITE = new THREE.Color(1, 1, 1);
function biomeColor(bl, key, out) {
  _c1.setHex(bl.a[key]); _c2.setHex(bl.b[key]);
  return (out || new THREE.Color()).copy(_c1).lerp(_c2, bl.k);
}
function biomeNum(bl, key) { return bl.a[key] + (bl.b[key] - bl.a[key]) * bl.k; }

// 해안 바이옴(인덱스 4)이 얼마나 섞여 있는가 → 바다가 나타나는 정도
function coastFactor(z) {
  let u = (z / BIOME_LEN) % BIOMES.length;
  if (u < 0) u += BIOMES.length;
  let d = Math.abs(u - 4);
  d = Math.min(d, BIOMES.length - d);        // 순환 거리
  const t = Math.max(0, 1 - d);
  return t * t * (3 - 2 * t);
}

// 설원 바이옴(인덱스 3)이 얼마나 섞여 있는가 → 눈이 오는 정도·나무에 쌓인 눈
function snowFactor(z) {
  let u = (z / BIOME_LEN) % BIOMES.length;
  if (u < 0) u += BIOMES.length;
  let d = Math.abs(u - 3);
  d = Math.min(d, BIOMES.length - d);
  // 설원(3) 바로 옆이 사막(2)이라, 예전처럼 바이옴 한 칸(d<1) 전체에 눈을 뿌리면
  // HUD 가 아직 '사막'인 구간까지 눈이 내린다. 이름이 설원으로 바뀌는 d<0.5 안쪽으로 좁힌다.
  const t = Math.max(0, 1 - d * 2.1);
  return t * t * (3 - 2 * t);
}

// ═══════════════════════════════════════════════════════════
//  도로 · 지형 · 바다
// ═══════════════════════════════════════════════════════════
// 왕복 2차로 지방도 — 차로폭 3.6m 라 반폭이 3.6, 갓길은 1.7m 로 좁다.
// CORRIDOR = 노면+갓길 폭. 여기까지는 지형이 노면 높이 그대로여야 도로가 파묻히지 않는다.
// SHOULDER = 그 바깥에서 지형이 제 높이로 돌아오기까지의 거리. 언덕 진폭을 키웠으니
// 이 거리도 크게 잡아야 도로 옆이 절벽처럼 솟지 않는다.
const ROAD_HALF = 4.6, CORRIDOR = 7.2, SHOULDER = 75;
// 코너링 한계 횡가속도(m/s²). 높이면 더 빠르게 코너를 돌 수 있다. 10 ≈ 1.0G
const MAX_LAT = 10;
const CORNER_GRIP_FALL = 0.05;   // 한계 초과분이 1초에 남는 비율(작을수록 급격히 감속)
const CORNER_SCRUB = 0.22;       // 조향 중 타이어 마찰로 잃는 속도 비율/초 (조향 최대일 때)
const BODY_SETTLE = 0.002;   // 차체가 지형 기울기를 따라가는 감쇠(1초에 남는 비율). 클수록 물렁
// 진행 방향이 차 방향을 따라오는 지연 — 작을수록 착 붙고, 키우면 더 미끄럽다
const SLIDE_HOLD = 0.0009;   // 1초(그립 1 기준)에 남는 어긋남 비율
const SLIDE_MAX  = 0.30;     // 최대 미끄럼 각도(rad) ≈ 17°
const RT_SS = 1.4;           // 후처리 렌더타깃 배율(수퍼샘플링). 낮추면 가볍고 거칠어진다
const BRAKE_FORCE = 18;      // 브레이크(스페이스) 감속도 m/s² — 크면 더 빨리 선다
const GROUND_SLACK = 0.06;  // 차가 지면 위로 뜰 수 있는 최대 높이(서스펜션 여유)
const CRUISE = 46.7;       // 손 떼면 일반 최고속(계기판 100)까지 유지
const SEA_DROP = 9;        // 도로면 대비 해수면 깊이
const SHORE_START = 30;    // 도로 오른쪽 이만큼부터 해변이 시작
const SHORE_LEN = 80;

// 굽이가 잦은 시골길 — 큰 곡선 위에 중·소 곡선을 겹쳐 커브가 계속 이어지게 한다
const roadX = z => 62 * Math.sin(z * 0.0016) + 26 * Math.sin(z * 0.0043 + 2.1)
                 + 13 * Math.sin(z * 0.0101 + 0.7) + 6 * Math.sin(z * 0.0196 + 1.4);
// 오르막·내리막도 더 자주 — 도로가 지형을 타고 넘는 느낌을 만든다
const roadY = z => 15 * Math.sin(z * 0.0021 + 0.5) + 6.5 * Math.sin(z * 0.0057 + 1.9)
                 + 2.6 * Math.sin(z * 0.0134 + 3.1);
const seaY = z => roadY(z) - SEA_DROP;

// 능선·골짜기가 뚜렷하도록 큰 파동을 키우고 잔주름 옥타브를 하나 더 얹는다
function hills(x, z) {
  return 24 * Math.sin(x * 0.0058) * Math.cos(z * 0.0051)
       + 11 * Math.sin(x * 0.0138 + 2.4) * Math.cos(z * 0.0115 + 0.6)
       +  6 * Math.sin(x * 0.021 + 1.2) * Math.sin(z * 0.017)
       +  2.4 * Math.sin(x * 0.061) * Math.sin(z * 0.054)
       +  0.9 * Math.sin(x * 0.148 + 0.3) * Math.sin(z * 0.131);
}
const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

function terrainHeight(x, z) {
  const rX = roadX(z), rY = roadY(z);
  const d = Math.abs(x - rX);
  // 노면 캠버(가운데가 볼록). 예전엔 도로 안쪽만 깎아서 d=ROAD_HALF 에서 25cm 단차가 났고,
  // 그게 도로 가장자리가 잘려 보이던 원인이었다. 갓길까지 같은 값을 빼서 연속으로 잇는다.
  // 노면·갓길 구간은 완전히 평평 — 캠버는 도로 메시가 따로 만든다
  let h = rY - 0.25;
  if (d > CORRIDOR) {
    const t = smooth((d - CORRIDOR) / SHOULDER);
    h += hills(x, z) * biomeNum(biomeAt(z), 'hill') * t;
  }
  // 해안: 도로 오른쪽 지형을 바다로 끌어내린다
  const c = coastFactor(z);
  if (c > 0.002) {
    const sh = smooth((x - rX - SHORE_START) / SHORE_LEN);
    if (sh > 0) {
      const bed = rY - 2 - (SEA_DROP + 26) * sh;
      h = h + (bed - h) * c * sh;
    }
  }
  return h;
}

const _n = new THREE.Vector3();
function terrainNormal(x, z) {
  const e = 1.5;
  return _n.set(terrainHeight(x - e, z) - terrainHeight(x + e, z), 2 * e,
                terrainHeight(x, z - e) - terrainHeight(x, z + e)).normalize();
}

function hash2(i, j) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// 값 노이즈 — hash2 를 이중 보간해 부드러운 밀도 맵을 만든다(퍼린 계열).
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const fx = x - xi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return (hash2(xi, zi)         * (1 - u) + hash2(xi + 1, zi)     * u) * (1 - v)
       + (hash2(xi, zi + 1)     * (1 - u) + hash2(xi + 1, zi + 1) * u) * v;
}
// 옥타브 3개를 겹쳐 큰 숲 덩어리 안에 작은 빈터가 생기게 한다
function forestDensity(wx, wz) {
  return vnoise(wx / 190, wz / 190) * 0.55
       + vnoise(wx / 70,  wz / 70)  * 0.30
       + vnoise(wx / 26,  wz / 26)  * 0.15;
}

// ═══════════════════════════════════════════════════════════
//  렌더러
// ═══════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({
  antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;      // 밝은 낮에 하늘이 하얗게 타버리지 않게 살짝 낮춘다
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_NEAR = 80, FOG_FAR = 700;
scene.fog = new THREE.Fog(0xc8dcee, FOG_NEAR, FOG_FAR);
// 차에 바짝 붙은 시점이라 화각을 좁혀야 원근이 과장되지 않고 차가 크게 잡힌다
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 5000);

// ── 하늘: 대기 산란 근사 + 구름 + 별 ─────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    sunDir:   { value: new THREE.Vector3(0, 1, 0) },
    dayAmt:   { value: 1 },
    cloud:    { value: 0.35 },
    time:     { value: 0 },
    zenith:   { value: new THREE.Color(0x2c63b0) },
    horizon:  { value: new THREE.Color(0xcfe2f2) },
  },
  vertexShader: `varying vec3 vP;
    void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 sunDir, zenith, horizon;
    uniform float dayAmt, cloud, time;
    varying vec3 vP;

    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h21(i), h21(i + vec2(1,0)), f.x),
                 mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
      return v;
    }

    void main(){
      vec3 d = normalize(vP);
      float h = max(d.y, 0.0);
      vec3 sd = normalize(sunDir);
      float mu = max(dot(d, sd), 0.0);

      // 고도에 따른 하늘 — 지평선에서 두꺼운 대기
      float t = pow(1.0 - h, 3.2);
      vec3 col = mix(zenith, horizon, t);

      // 태양 주변 전방 산란 (노을이 하늘 절반을 물들인다)
      float low = smoothstep(0.35, -0.08, sd.y);          // 해가 낮을수록 1
      vec3 warm = vec3(1.0, 0.45, 0.16);
      col += warm * pow(mu, 4.0) * (0.35 + low * 1.5) * dayAmt;
      col += warm * pow(mu, 1.4) * low * 0.35 * t;
      col = mix(col, vec3(0.95, 0.42, 0.22), low * pow(1.0 - h, 9.0) * 0.75 * dayAmt);

      // 태양 원반 + 헤일로
      float disc = smoothstep(0.9985, 0.99955, mu);
      col += vec3(1.0, 0.92, 0.78) * disc * 6.0 * dayAmt;
      col += vec3(1.0, 0.85, 0.6) * pow(mu, 180.0) * 0.8 * dayAmt;

      // 별
      float night = 1.0 - dayAmt;
      if (night > 0.01) {
        vec2 sp = d.xz / max(abs(d.y), 0.08) * 6.0;
        float s = h21(floor(sp * 14.0));
        float star = smoothstep(0.9965, 1.0, s) * smoothstep(0.0, 0.25, d.y);
        col += vec3(0.9, 0.94, 1.0) * star * night * (0.6 + 0.4 * sin(time * 2.0 + s * 60.0));
      }

      // 구름층
      if (d.y > 0.015) {
        vec2 cp = d.xz / d.y * 0.55 + vec2(time * 0.006, time * 0.0025);
        float f = fbm(cp * 1.7);
        float cover = smoothstep(0.62 - cloud * 0.42, 0.92 - cloud * 0.3, f);
        cover *= smoothstep(0.02, 0.16, d.y);
        vec3 lit = mix(vec3(0.42, 0.44, 0.5), vec3(1.02, 0.99, 0.96), dayAmt);
        lit = mix(lit, warm * 1.5, low * dayAmt * 0.75);
        vec3 shade = mix(vec3(0.16, 0.18, 0.26), vec3(0.55, 0.57, 0.63), dayAmt);
        float lift = smoothstep(0.5, 1.0, f);
        col = mix(col, mix(shade, lit, lift), cover * 0.9);
      }

      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2600, 24, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);

// 카메라가 차에 바짝 붙었으니 그림자 범위도 좁혀 같은 맵으로 더 촘촘하게 받는다
const SH = 60;      // 그림자 범위를 좁혀 같은 맵으로 더 촘촘하게
const SHADOW_MAP = 2048;   // 텍셀 = 120m / 2048 ≈ 5.9cm (1024 면 11.7cm 라 차 위에서 티가 난다)
const WORLD_UP = new THREE.Vector3(0, 1, 0);
const _sdir = new THREE.Vector3(), _sright = new THREE.Vector3(),
      _sup = new THREE.Vector3(), _spos = new THREE.Vector3();
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(SHADOW_MAP, SHADOW_MAP);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 800;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.35;      // 잎·풀 같은 얇은 면에서 생기는 얼룩(그림자 여드름) 방지
scene.add(sun, sun.target);

// 하늘빛(위) + 땅에서 튄 빛(아래). 그늘이 새까매지지 않게 받쳐 주는 역할이다.
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x8a8468, 1.15);
scene.add(hemi);
// 태양 반대편에서 아주 약하게 채워 넣는 빛 — 그림자 속 형태가 죽지 않는다
const fill = new THREE.DirectionalLight(0xdce9ff, 0.35);
scene.add(fill, fill.target);      // target 도 씬에 넣어야 차가 멀리 가도 방향이 유지된다

// ── 환경 반사: 하늘 셰이더를 그대로 큐브맵으로 구워 쓴다.
//    외부 HDRI 를 받지 않고도 차체·젖은 노면에 지금 시각·날씨의 하늘이 비친다.
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
let envRT = null, envAt = -99;
function updateEnv() {
  const keep = sky.position.clone();
  sky.position.set(0, 0, 0);        // PMREM 은 원점에서 굽는다
  envScene.add(sky);                // 잠시 옮겼다가
  let rt = null;
  // far 기본값(100)으로는 반지름 2600 짜리 하늘 구가 통째로 잘린다
  try { rt = pmrem.fromScene(envScene, 0.02, 1, 4000); } catch (e) { /* 반사는 없어도 게임은 돈다 */ }
  scene.add(sky);                   // 원래 씬으로 되돌린다
  sky.position.copy(keep);
  if (!rt) return;
  if (envRT) envRT.dispose();
  envRT = rt;
  scene.environment = rt.texture;
}

// ═══════════════════════════════════════════════════════════
//  지형 청크
// ═══════════════════════════════════════════════════════════
const CS = 150, RES = 46, GRID = 5;
const chunks = [];
// 도로와 같은 Standard 계열로 맞춰야 땅·노면·차가 한 화면에서 따로 놀지 않는다
const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.15 });

// ── 땅 자체에 잔디 질감을 그린다.
// 3D 풀포기는 아무리 늘려도 수십 미터까지가 한계라, 그 너머는 지형이 직접 잔디처럼
// 보여야 한다. 큰 얼룩(풀밭의 결) → 중간 뭉치 → 잔알갱이(잎끝) 순으로 겹치고,
// 멀어질수록 잔알갱이를 죽여 지글거림을 막는다. 이러면 맵 전체가 잔디로 덮여 보인다.
// 속도가 붙으면 화면이 '뒤로 흐르는' 스트로보(마차바퀴) 현상이 생긴다.
// 60fps · 100km/h 면 한 프레임에 0.78m 를 가는데, 노면 알갱이(주기 0.27m)나
// 풀 뭉치(0.59m)처럼 그보다 잘게 반복되는 무늬는 표본화가 모자라 역방향으로 흐른다.
// → 빠를 때 그 잔무늬만 걷어 낸다. 큰 얼룩(주기 3m 이상)은 그대로 둔다.
const detailU = { value: 1 };

groundMat.onBeforeCompile = shader => {
  shader.uniforms.uDetail = detailU;
  shader.vertexShader = 'varying vec3 vGWPos;\n' + shader.vertexShader
    .replace('#include <project_vertex>', `
      #include <project_vertex>
      vGWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
    `);

  shader.fragmentShader = `
    varying vec3 vGWPos;
    uniform float uDetail;
    float gh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float gn(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(gh(i), gh(i + vec2(1,0)), f.x),
                 mix(gh(i + vec2(0,1)), gh(i + vec2(1,1)), f.x), f.y);
    }
  ` + shader.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>
    {
      vec2 gp = vGWPos.xz;
      float gdist = length(cameraPosition - vGWPos);
      float gnear = 1.0 - smoothstep(20.0, 90.0, gdist);          // 멀면 잔디알갱이를 뭉갠다

      float gpatch = gn(gp * 0.09) * 0.6 + gn(gp * 0.31) * 0.4;   // 풀밭의 큰 결
      float gtuft  = mix(0.5, gn(gp * 1.7), uDetail);              // 풀 뭉치 (빠르면 뭉갠다)

      float glum = 0.80 + gpatch * 0.34 + (gtuft - 0.5) * 0.34 * (0.35 + 0.65 * gnear);
      diffuseColor.rgb *= glum;
      // 마른 풀(누런빛) ↔ 짙은 풀(초록빛). 단, 원래 초록인 곳에서만 —
      // 모래·눈·바위까지 풀색으로 물들면 안 된다.
      float ggreen = clamp((diffuseColor.g - (diffuseColor.r + diffuseColor.b) * 0.5) * 5.0, 0.0, 1.0);
      vec3 gdry = vec3(1.10, 1.04, 0.80), glush = vec3(0.84, 1.06, 0.80);
      vec3 gtint = mix(gdry, glush, smoothstep(0.35, 0.72, gpatch * 0.55 + gtuft * 0.45));
      diffuseColor.rgb *= mix(vec3(1.0), gtint, ggreen);
    }
  `);
};

for (let i = 0; i < GRID * GRID; i++) {
  const g = new THREE.PlaneGeometry(CS, CS, RES, RES).rotateX(-Math.PI / 2);
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3), 3));
  const m = new THREE.Mesh(g, groundMat);
  m.receiveShadow = true; m.frustumCulled = false;
  scene.add(m);
  chunks.push({ mesh: m, cx: null, cz: null });
}

const _gc = new THREE.Color(), _rc = new THREE.Color();
const ASPHALT = new THREE.Color(0x3a3b41), DIRT = new THREE.Color(0x6b5c46);
const SHOULDER_W = 1.7;                    // 도로 밖 흙 갓길 폭 — roadMesh 가 여기까지 덮는다
const SAND = new THREE.Color(0xe3d3a8), WET = new THREE.Color(0x9a916f);

function buildChunk(ch, cx, cz) {
  ch.cx = cx; ch.cz = cz;
  const ox = cx * CS, oz = cz * CS;
  ch.mesh.position.set(ox, 0, oz);
  const pos = ch.mesh.geometry.attributes.position;
  const col = ch.mesh.geometry.attributes.color;

  for (let i = 0; i < pos.count; i++) {
    const wx = pos.getX(i) + ox, wz = pos.getZ(i) + oz;
    const h = terrainHeight(wx, wz);
    pos.setY(i, h);

    const bl = biomeAt(wz);
    biomeColor(bl, 'ground', _gc);
    biomeColor(bl, 'rock', _rc);
    const d = Math.abs(wx - roadX(wz));
    const sl = seaY(wz);

    if (d < ROAD_HALF) {
      // 노면·차선·갓길은 roadMesh 가 픽셀 단위로 덮는다. 여기는 그 아래 바탕이라
      // roadMesh 와 같은 순서(아스팔트 → 흙 → 땅)로 칠해 두 메시의 경계가 안 보이게 한다.
      // 여기는 roadMesh 아래라 화면에 안 나온다. 갓길 색까지 지형에 칠하면
      // 정점 간격(2.3m)만큼 색 경계가 톱니처럼 잡혀 도로 옆이 지그재그로 보였다.
      _tmp.copy(ASPHALT).lerp(DIRT, smooth(d / ROAD_HALF));
    } else {
      const nrm = terrainNormal(wx, wz);
      const steep = smooth((1 - nrm.y - 0.1) * 4.5);
      _tmp.copy(_gc).lerp(_rc, steep);
      // 해수면 근처는 모래사장, 물속은 젖은 색
      const above = h - sl;
      if (above < 9) {
        const beach = 1 - smooth((above - 1) / 8);
        _tmp.lerp(SAND, beach * 0.9);
        if (above < 0) _tmp.lerp(WET, Math.min(1, -above / 6) * 0.7);
      }
      _tmp.multiplyScalar(0.92 + hash2(Math.round(wx * 0.7), Math.round(wz * 0.7)) * 0.16);
    }
    col.setXYZ(i, _tmp.r, _tmp.g, _tmp.b);
  }
  pos.needsUpdate = true; col.needsUpdate = true;
  ch.mesh.geometry.computeVertexNormals();
}

function updateChunks(px, pz) {
  const bx = Math.round(px / CS), bz = Math.round(pz / CS);
  const half = (GRID - 1) / 2;
  const want = [];
  for (let i = -half; i <= half; i++)
    for (let j = -half; j <= half; j++) want.push([bx + i, bz + j]);
  const keep = new Set(), free = [];
  for (const ch of chunks) {
    const hit = want.find(w => w[0] === ch.cx && w[1] === ch.cz);
    if (hit) keep.add(hit[0] + ',' + hit[1]); else free.push(ch);
  }
  for (const [cx, cz] of want) {
    if (keep.has(cx + ',' + cz)) continue;
    const ch = free.pop();
    if (!ch) break;
    buildChunk(ch, cx, cz);
    break;                    // 프레임당 한 청크만 — 나머지는 다음 프레임에
  }
}

// ═══════════════════════════════════════════════════════════
//  바다 — 도로 공식을 셰이더에서 그대로 계산해 해수면을 만든다
// ═══════════════════════════════════════════════════════════
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    time:     { value: 0 },
    sunDir:   { value: new THREE.Vector3() },
    sunCol:   { value: new THREE.Color(0xfff0d0) },
    skyCol:   { value: new THREE.Color(0x9dc4e8) },
    deepCol:  { value: new THREE.Color(0x0e3550) },
    shallow:  { value: new THREE.Color(0x2d8ba8) },
    fogColor: { value: new THREE.Color() },
    fogNear:  { value: FOG_NEAR },
    fogFar:   { value: FOG_FAR },
  },
  vertexShader: `
    uniform float time;
    varying vec3 vW; varying float vC; varying float vWave;

    float roadYf(float z){ return 15.0*sin(z*0.0021+0.5) + 6.5*sin(z*0.0057+1.9)
                                + 2.6*sin(z*0.0134+3.1); }
    float coastF(float z){
      float u = mod(z / 3400.0, 5.0);
      float d = abs(u - 4.0);
      d = min(d, 5.0 - d);
      float t = clamp(1.0 - d, 0.0, 1.0);
      return t * t * (3.0 - 2.0 * t);
    }

    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      float base = roadYf(wp.z) - 9.0;
      float w = sin(wp.x * 0.055 + time * 1.1) * 0.34
              + sin(wp.z * 0.043 - time * 0.9) * 0.42
              + sin((wp.x + wp.z) * 0.021 + time * 0.55) * 0.55
              + sin(wp.x * 0.13 - time * 1.9) * 0.12;
      wp.y = base + w;
      vW = wp.xyz; vC = coastF(wp.z); vWave = w;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 sunDir, sunCol, skyCol, deepCol, shallow, fogColor;
    uniform float fogNear, fogFar, time;
    varying vec3 vW; varying float vC; varying float vWave;

    void main(){
      if (vC < 0.02) discard;
      vec3 dx = dFdx(vW), dy = dFdy(vW);
      vec3 n = normalize(cross(dy, dx));
      if (n.y < 0.0) n = -n;
      vec3 v = normalize(cameraPosition - vW);
      float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);

      vec3 col = mix(deepCol, shallow, clamp(vWave * 0.6 + 0.5, 0.0, 1.0) * 0.5);
      col = mix(col, skyCol, 0.25 + fres * 0.65);

      vec3 sd = normalize(sunDir);
      vec3 h = normalize(sd + v);
      col += sunCol * pow(max(dot(n, h), 0.0), 220.0) * 2.2;         // 반짝임
      float glit = pow(max(dot(n, h), 0.0), 30.0) * max(sd.y + 0.15, 0.0);
      col += sunCol * glit * 0.35;

      float dist = length(cameraPosition - vW);
      float f = clamp((dist - fogNear) / (fogFar - fogNear), 0.0, 1.0);
      col = mix(col, fogColor, f);

      gl_FragColor = vec4(col, vC * (0.86 + fres * 0.14));
    }`,
});
const waterGeo = new THREE.PlaneGeometry(2600, 2600, 190, 190).rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat);
water.frustumCulled = false;
water.renderOrder = 1;
scene.add(water);

// ═══════════════════════════════════════════════════════════
//  나무 · 바위 · 가드레일
// ═══════════════════════════════════════════════════════════
// ── 캔버스로 잎·솔잎·풀 텍스처를 그린다 (외부 이미지 없이 알파 있는 텍스처를 얻는다)
function makeCanvasTex(size, draw) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();   // 비스듬히 볼 때 뭉개짐 방지
  t.minFilter = THREE.LinearMipmapLinearFilter;              // 멀리서 지글대는 걸 막는다
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  return t;
}

const leafTex = makeCanvasTex(256, (g, s) => {
  // 어두운 잎을 먼저 깔고 밝은 잎을 위에 얹어, 한 장 안에서 명암이 생기게 한다
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < 120; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.62) * s * 0.46;       // 가운데가 빽빽하게
      const lw = s * 0.05 * (0.7 + Math.random() * 0.7), lh = lw * 1.8;
      // 1패스는 그늘진 속잎, 2패스는 햇빛 받는 겉잎
      const lum = pass === 0 ? 0.55 + Math.random() * 0.25
                             : 1.05 + Math.random() * 0.45 - (r / s) * 0.35;
      g.save();
      g.translate(s / 2 + Math.cos(a) * r, s / 2 + Math.sin(a) * r);
      g.rotate(Math.random() * Math.PI);
      g.fillStyle = `rgb(${Math.min(255, Math.round(92 * lum))},${Math.min(255, Math.round(158 * lum))},${Math.min(255, Math.round(72 * lum))})`;
      g.beginPath(); g.ellipse(0, 0, lw, lh, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }
});

const needleTex = makeCanvasTex(256, (g, s) => {
  g.lineCap = 'round';
  for (let b = 0; b < 8; b++) {
    const by = s * (0.06 + b * 0.125);
    const len = s * 0.44 * (1 - b * 0.085);
    g.strokeStyle = '#4a3b2a'; g.lineWidth = s * 0.013;
    for (const side of [-1, 1]) {
      g.beginPath(); g.moveTo(s / 2, by); g.lineTo(s / 2 + side * len, by + s * 0.035); g.stroke();
    }
    for (let i = 0; i < 30; i++) {                              // 가지에 붙은 솔잎
      const t = i / 30, side = i % 2 ? 1 : -1;
      const x = s / 2 + side * len * t, y = by + s * 0.035 * t;
      const lum = 0.75 + Math.random() * 0.6;
      g.strokeStyle = `rgb(${Math.min(255, Math.round(74 * lum))},${Math.min(255, Math.round(128 * lum))},${Math.min(255, Math.round(78 * lum))})`;
      g.lineWidth = s * 0.0085;
      g.beginPath(); g.moveTo(x, y);
      g.lineTo(x + side * s * 0.032 * (0.5 + Math.random()), y + s * 0.055 * (0.5 + Math.random()));
      g.stroke();
    }
  }
});

const grassTex = makeCanvasTex(128, (g, s) => {
  // 뾰족한 바늘이 아니라 폭이 있고 끝이 둥근 잎. 밝은 연두~초록 사이에서 고른다.
  for (let i = 0; i < 26; i++) {
    const x0 = s * (0.04 + Math.random() * 0.92);
    const h = s * (0.40 + Math.random() * 0.50);
    const bend = (Math.random() - 0.5) * s * 0.42;      // 휘는 정도를 크게
    const w = s * 0.075 * (0.7 + Math.random() * 0.9);  // 두툼하게
    const lum = 0.78 + Math.random() * 0.42;
    g.fillStyle = `rgb(${Math.min(255, Math.round(126 * lum))},${Math.min(255, Math.round(178 * lum))},${Math.min(255, Math.round(84 * lum))})`;
    g.beginPath();
    g.moveTo(x0 - w, s);
    g.quadraticCurveTo(x0 - w * 0.75 + bend * 0.5, s - h * 0.6, x0 + bend - w * 0.22, s - h);
    g.quadraticCurveTo(x0 + bend, s - h - w * 0.5, x0 + bend + w * 0.22, s - h);  // 둥근 끝
    g.quadraticCurveTo(x0 + w * 0.75 + bend * 0.5, s - h * 0.6, x0 + w, s);
    g.closePath(); g.fill();
  }
});

// ── 지오메트리 합치기 (addon 없이 draw call 을 줄인다)
function mergeGeos(list) {
  const geos = list.map(g => g.index ? g.toNonIndexed() : g);
  let n = 0;
  for (const g of geos) n += g.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  let o = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    o += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return out;
}

// 나무마다 모양이 달라 보이되 새로고침해도 같도록 고정 시드를 쓴다
let _seed = 20260812;
const rnd = () => ((_seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0) / 4294967296);

// 잎 뭉치 = 텍스처 붙인 판때기 여러 장을 엇갈리게 세운 것.
// 원뿔 한 덩이보다 훨씬 가볍고, 실루엣에 잎 모양이 살아난다.
function cardCluster(n, o) {
  const parts = [];
  for (let i = 0; i < n; i++) {
    const g = new THREE.PlaneGeometry(o.w * (0.75 + rnd() * 0.5), o.h * (0.75 + rnd() * 0.5));
    g.rotateX((rnd() - 0.5) * o.tilt);
    g.rotateZ((rnd() - 0.5) * o.tilt);
    g.rotateY(rnd() * Math.PI * 2);
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * o.spread;
    g.translate(Math.cos(a) * r, o.y + (rnd() - 0.5) * o.ySpread, Math.sin(a) * r);
    parts.push(g);
  }
  return mergeGeos(parts);
}

const CONIF_MAX = 520, BROAD_MAX = 520, ROCK_MAX = 200, POST_MAX = 240;
const DEAD_MAX = 90, STUMP_MAX = 90;
// 풀은 반경 44셀 ≈ 6100칸. 가장 빽빽한 초원에서도 잘리지 않도록 넉넉히 잡는다.
// 모자라면 루프가 중간에 끊겨 한쪽 방향 풀만 통째로 사라진다.
const GRASS_MAX = 0, BUSH_MAX = 320;

  new THREE.BoxGeometry(0.26, 1.9, 0.26).translate(0, 0.95, 0).rotateZ(0.7).translate(0, 4.1, 0),

const deadGeo = mergeGeos([

// 그루터기 — 베어낸 자리
const stumpGeo = mergeGeos([
  new THREE.BoxGeometry(0.9, 0.7, 0.9).translate(0, 0.35, 0),

// ── 잎·풀은 수직 판이라 위에서 오는 햇빛과 법선이 직각이 되어 새까맣게 나온다.
//    법선을 실제 면이 아니라 "덩어리의 바깥쪽"으로 바꿔 줘야 빛을 제대로 받는다.
function sphereNormals(geo, cy, k) {
  const p = geo.attributes.position, n = geo.attributes.normal;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i), p.getY(i) - cy, p.getZ(i)).normalize();          // 수관 중심에서 바깥으로
    n.setXYZ(i,
      n.getX(i) * (1 - k) + v.x * k,
      n.getY(i) * (1 - k) + (v.y * 0.5 + 0.5) * k,                    // 위쪽으로 살짝 들어올린다
      n.getZ(i) * (1 - k) + v.z * k);
  }
  const a = geo.attributes.normal;
  for (let i = 0; i < a.count; i++) {
    v.set(a.getX(i), a.getY(i), a.getZ(i)).normalize();
    a.setXYZ(i, v.x, v.y, v.z);
  }
  return geo;
}
function upNormals(geo) {
  const n = geo.attributes.normal;
  for (let i = 0; i < n.count; i++) n.setXYZ(i, 0, 1, 0);             // 잔디는 땅처럼 하늘을 본다
  return geo;
}

// 잎도 네모 블록 무더기로 — 마인크래프트처럼 각지게 쌓는다
function boxCluster(n, o) {
  const parts = [];
  for (let i = 0; i < n; i++) {
    const w = o.w * (0.6 + rnd() * 0.6), h = o.h * (0.6 + rnd() * 0.6);
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * o.spread;
    parts.push(new THREE.BoxGeometry(w, h, w)
      .translate(Math.cos(a) * r, o.y + (rnd() - 0.5) * o.ySpread, Math.sin(a) * r));
  }
  return mergeGeos(parts);
}
// 활엽수 수관 — 아래는 넓고 위로 갈수록 좁아지는 네모 3층 + 옆에 붙는 작은 덩어리
const broadGeo = mergeGeos([

  new THREE.BoxGeometry(2.2, 1.2, 2.2).translate(0, 7.9, 0),
  new THREE.BoxGeometry(1.6, 1.0, 1.6).translate(1.7, 5.8, 0.6),
  new THREE.BoxGeometry(1.4, 0.9, 1.4).translate(-1.5, 6.3, -0.8),
]);

const grassGeo = mergeGeos([0, 1, 2].map(i => new THREE.BoxGeometry(0.3, 0.5, 0.3)

// 덤불 — 나무보다 낮고 옆으로 퍼진 잎 뭉치. 나무와 풀 사이의 빈 층을 메운다.

// ── 선인장(사구아로) — 사막 전용. 기둥 하나 + 팔 두 개(가로로 뻗었다가 위로 꺾인다)
const cactusGeo = (() => {
  const parts = [new THREE.CylinderGeometry(0.26, 0.30, 3.1, 9, 1).translate(0, 1.55, 0)];
  for (const sx of [-1, 1]) {
    const y0 = sx > 0 ? 1.55 : 1.15;                       // 좌우 팔 높이를 다르게 — 대칭 티를 없앤다
    const arm = new THREE.CylinderGeometry(0.15, 0.15, 0.62, 7, 1);
    arm.rotateZ(Math.PI / 2);
    parts.push(arm.translate(sx * 0.42, y0, 0));            // 가로로 뻗은 부분
    parts.push(new THREE.CylinderGeometry(0.15, 0.15, 0.95, 7, 1)
      .translate(sx * 0.70, y0 + 0.46, 0));                 // 위로 꺾인 부분
  }
  return mergeGeos(parts);
})();
const CACTUS_MAX = 220;

// 배럴 선인장 — 땅에 붙은 통 모양. 능선은 세그먼트를 적게 줘서 각지게 낸다.
const cactusBarrelGeo = (() => {
  const g = new THREE.CylinderGeometry(0.52, 0.44, 0.78, 8, 1).translate(0, 0.39, 0);
  const top = new THREE.SphereGeometry(0.52, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2)
    .translate(0, 0.78, 0);                                // 윗면을 둥글게 덮는다
  return mergeGeos([g, top]);
})();
const BARREL_MAX = 120;

// 기둥 군락 — 팔 없이 굵기·높이가 제각각인 대가 모여 자란다
const cactusColGeo = (() => {

  for (const [x, z, r, h] of set)

const COL_MAX = 90;

// 바위 — 정12면체를 그대로 쓰면 너무 규칙적이라 정점을 흩어 놓는다
const rockGeo = new THREE.BoxGeometry(2.2, 1.6, 2.0);
{
  const p = rockGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const d = 0.74 + hash2(Math.round(x * 41), Math.round(y * 67 + z * 31)) * 0.52;

const postGeo = new THREE.BoxGeometry(0.14, 1.15, 0.14).translate(0, 0.58, 0);
const railGeo = new THREE.BoxGeometry(0.09, 0.3, 4.2).translate(0, 0.92, 0);

// ── 바람: 밑동은 고정되고 위로 갈수록 흔들린다
const windU = { uTime: { value: 0 } };
// fade = [시작 거리, 완전히 사라지는 거리]. 카메라와의 실제 거리로 매 프레임 계산하므로
// 인스턴스를 다시 깔든 말든 티가 안 난다. 풀이 깜빡이며 생겼다 사라지던 원인이 이거였다.
function addWind(mat, amount, fade) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = windU.uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 iw = instanceMatrix[3].xyz;
      #else
        vec3 iw = vec3(0.0);
      #endif
      float sw = max(transformed.y, 0.0) * ${amount.toFixed(4)};
      float ph = uTime * 1.7 + iw.x * 0.31 + iw.z * 0.24;
      transformed.x += sin(ph) * sw;
      transformed.z += cos(ph * 0.81) * sw * 0.6;
      ${fade ? `
      float fd = distance(cameraPosition.xz, iw.xz);
      transformed *= 1.0 - smoothstep(${fade[0].toFixed(1)}, ${fade[1].toFixed(1)}, fd);
      ` : ''}
    `);
  };
}

const mkInst = (geo, mat, n) => {
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
  scene.add(m); return m;
};

const barkMat = new THREE.MeshLambertMaterial({ color: 0x6b543f, flatShading: true });
// alphaTest 로 잘라내면 반투명 정렬 문제가 없고 그림자도 잎 모양대로 진다.
// alphaToCoverage 를 켜면 MSAA 를 써서 잘린 가장자리의 계단 현상이 크게 줄어든다.
const broadLeafMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
const conifLeafMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
const grassMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
addWind(broadLeafMat, 0.010);
addWind(conifLeafMat, 0.006);
// 3D 풀포기는 32m 부터 서서히 낮아져 50m 에서 없어진다. 그 너머는 지형 셰이더의
// 잔디 질감이 이어받으므로 경계가 보이지 않는다.

const trunksB = mkInst(trunkBroadGeo, barkMat, BROAD_MAX);

const trunksC = mkInst(trunkConifGeo, barkMat, CONIF_MAX);

const rocks   = mkInst(rockGeo, new THREE.MeshLambertMaterial({ color: 0x8d8d84, flatShading: true }), ROCK_MAX);
const posts   = mkInst(postGeo, new THREE.MeshLambertMaterial({ color: 0x9a9a96 }), POST_MAX);
const rails   = mkInst(railGeo, new THREE.MeshStandardMaterial({
  color: 0xb9bcbd, roughness: 0.45, metalness: 0.6 }), POST_MAX);
const bushes  = mkInst(bushGeo, broadLeafMat, BUSH_MAX);
const deads   = mkInst(deadGeo, new THREE.MeshLambertMaterial({ color: 0x7c6a53, flatShading: true }), DEAD_MAX);
const stumps  = mkInst(stumpGeo, new THREE.MeshLambertMaterial({ color: 0x6b543f, flatShading: true }), STUMP_MAX);
const cacti   = mkInst(cactusGeo, new THREE.MeshLambertMaterial({ color: 0x4f7a43, flatShading: true }), CACTUS_MAX);
const cactiB  = mkInst(cactusBarrelGeo, new THREE.MeshLambertMaterial({ color: 0x5c8248, flatShading: true }), BARREL_MAX);
const cactiC  = mkInst(cactusColGeo,    new THREE.MeshLambertMaterial({ color: 0x47703d, flatShading: true }), COL_MAX);

for (const m of [leavesB, leavesC, bushes])
  m.instanceColor = new THREE.InstancedBufferAttribute(
    new Float32Array(m.count * 3), 3);

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion();
const _pos = new THREE.Vector3(), _scl = new THREE.Vector3(), _axis = new THREE.Vector3(0, 1, 0);
const CELL = 22, SCAT_R = 14;
let scatterKey = '';

const NO_TREE = 8;                 // 도로 중심선 8m 안은 생성 금지
const SLOPE_MAX = Math.cos(30 * Math.PI / 180);   // 경사 30도 이상 제외
const _eul = new THREE.Euler();

function scatter(px, pz) {
  const bx = Math.round(px / CELL), bz = Math.round(pz / CELL);
  const key = bx + ',' + bz;
  if (key === scatterKey) return;
  scatterKey = key;

  let ci = 0, bi = 0, ri = 0, ui = 0, di = 0, si = 0, ki = 0, kb = 0, kc = 0;
  for (let i = -SCAT_R; i <= SCAT_R; i++) {
    for (let j = -SCAT_R; j <= SCAT_R; j++) {
      const dd2 = i * i + j * j;
      if (dd2 > SCAT_R * SCAT_R) continue;
      // ── 원거리 처리: 바깥 테두리는 서서히 작아지며 사라진다(페이드인). 그 너머는 안개가 받는다.
      const dn = Math.sqrt(dd2) / SCAT_R;
      const tFade = 1 - smooth((dn - 0.78) / 0.22);
      if (tFade <= 0.05) continue;

      const gx = bx + i, gz = bz + j;
      const r = hash2(gx, gz);
      // 격자 지터 — 셀 폭의 ±35% 까지만 흔들어 최소 간격(0.3·CELL)을 보장한다.
      // 등간격 티는 없어지고 서로 겹치지도 않는다(포아송 디스크와 같은 효과).
      const wx = gx * CELL + (hash2(gx + 7331, gz) - 0.5) * CELL * 0.7;
      const wz = gz * CELL + (hash2(gx, gz + 7331) - 0.5) * CELL * 0.7;

      // ── 도로: 중심선 NO_TREE 안은 금지, 그 바깥부터 밀도가 서서히 올라간다
      const d = Math.abs(wx - roadX(wz));
      if (d < NO_TREE) continue;
      const roadK = smooth((d - NO_TREE) / 30);

      const y = terrainHeight(wx, wz);
      if (y < seaY(wz) + 1.2) continue;              // 물속엔 심지 않는다
      const nrm = terrainNormal(wx, wz);
      if (nrm.y < SLOPE_MAX) continue;               // 급경사 제외

      const bl = biomeAt(wz);
      // ── 군집: 퍼린 계열 노이즈 밀도 맵. 격자 티 없이 숲이 뭉치고 빈터가 생긴다.
      const fd = forestDensity(wx, wz);
      const clumpK = Math.pow(Math.max(0, fd - 0.32) / 0.68, 1.6) * 2.6;
      const dens = biomeNum(bl, 'trees') * clumpK * roadK * (1 - dn * 0.25);

      // ── 공통 랜덤화: 높이·폭 0.7~1.4 따로, Y 회전 0~360°, 기울기 ±5°
      const hv = 0.7 + hash2(gx + 13, gz + 91) * 0.7;
      const wv = 0.7 + hash2(gx + 401, gz + 17) * 0.7;
      const yaw = hash2(gx + 61, gz + 907) * Math.PI * 2;
      const TILT = 5 * Math.PI / 180;
      _eul.set((hash2(gx + 71, gz + 3) - 0.5) * 2 * TILT, yaw,
               (hash2(gx + 3, gz + 71) - 0.5) * 2 * TILT);
      _q.setFromEuler(_eul);

      if (r < dens) {
        const cactusP = biomeNum(bl, 'cactus');     // 사막일수록 1 에 가깝다
        const kind = hash2(gx + 909, gz + 55);
        if (kind < 0.06 && di < DEAD_MAX && cactusP < 0.55) {   // 죽은 나무 — 사막엔 세우지 않는다
          const s = (0.8 + hash2(gx + 5, gz + 9) * 0.6) * biomeNum(bl, 'treeH') * tFade;
          _pos.set(wx, y - 0.3, wz);                 // 밑동을 땅에 묻는다
          _scl.set(s * wv, s * hv, s * wv);
          _m4.compose(_pos, _q, _scl);
          deads.setMatrixAt(di++, _m4);
          continue;
        }
        // 사막에서는 나무 대신 선인장이 선다 — 한 종류만 쓰면 복붙 티가 나서 3종을 섞는다
        if (hash2(gx + 555, gz + 222) < cactusP) {
          const s = (0.75 + hash2(gx + 27, gz + 63) * 0.7) * tFade;
          const kind = hash2(gx + 77, gz + 404);
          if (kind < 0.30 && kb < BARREL_MAX) {              // 배럴 — 땅에 붙어 있어 조금 더 크게
            const sb = s * 1.15;
            _pos.set(wx, y - 0.10, wz);
            _scl.set(sb * wv, sb * hv, sb * wv);
            _m4.compose(_pos, _q, _scl);
            cactiB.setMatrixAt(kb++, _m4);
            continue;
          }
          if (kind < 0.55 && kc < COL_MAX) {                 // 기둥 군락
            _pos.set(wx, y - 0.15, wz);
            _scl.set(s * wv, s * hv, s * wv);
            _m4.compose(_pos, _q, _scl);
            cactiC.setMatrixAt(kc++, _m4);
            continue;
          }
          if (ki < CACTUS_MAX) {                             // 팔 달린 사와로
            _pos.set(wx, y - 0.15, wz);
            _scl.set(s * wv, s * hv, s * wv);
            _m4.compose(_pos, _q, _scl);
            cacti.setMatrixAt(ki++, _m4);
            continue;
          }
        }
        // 사막에는 나무가 자라지 않는다 — 선인장에 안 걸린 자리는 그냥 빈 땅.
        // cactusP 로 걸러서 바이옴 경계에서는 나무가 서서히 사라진다.
        if (cactusP > 0.55) continue;
        const conif = hash2(gx + 301, gz + 77) < biomeNum(bl, 'conif');
        const trunkM = conif ? trunksC : trunksB;
        const leafM  = conif ? leavesC : leavesB;
        const idx    = conif ? ci : bi;
        if (idx >= (conif ? CONIF_MAX : BROAD_MAX)) continue;

        const s = (0.55 + Math.pow(hash2(gx + 13, gz + 91), 0.7) * 1.5)
                * biomeNum(bl, 'treeH') * tFade;
        _pos.set(wx, y - 0.45, wz);                  // 밑동을 지면 아래로 묻어 뜨지 않게
        _scl.set(s * wv, s * hv, s * wv * (0.9 + hash2(gx + 19, gz + 503) * 0.25));
        _m4.compose(_pos, _q, _scl);
        trunkM.setMatrixAt(idx, _m4); leafM.setMatrixAt(idx, _m4);
        // 잎 색 — 바이옴 초록에 명도·채도를 ±10% 씩 흩는다
        biomeColor(bl, 'treeTop', _tmp).offsetHSL(
          (hash2(gx + 21, gz + 8) - 0.5) * 0.04,
          (hash2(gz, gx) - 0.5) * 0.20,
          (hash2(gz + 5, gx + 5) - 0.5) * 0.20);
        // 설원에서는 잎에 눈이 얹힌 느낌 — 나무마다 쌓인 양을 다르게 흩는다
        const snowK = snowFactor(wz);
        if (snowK > 0.01) _tmp.lerp(WHITE, snowK * (0.62 + hash2(gx + 88, gz + 12) * 0.34));
        leafM.setColorAt(idx, _tmp);
        if (conif) ci++; else bi++;
      } else if (r < dens + 0.10 * clumpK && si < STUMP_MAX && hash2(gx + 4, gz + 4) < 0.25) {
        // 그루터기 — 숲 언저리에 드문드문
        const s = (0.7 + hash2(gx + 33, gz + 12) * 0.6) * tFade;
        _pos.set(wx, y - 0.15, wz);
        _scl.set(s * wv, s * hv, s * wv);
        _m4.compose(_pos, _q, _scl);
        stumps.setMatrixAt(si++, _m4);
      } else if (r < dens + 0.22 * clumpK && ui < BUSH_MAX && tFade > 0.35) {
        // 덤불 — 숲 군집 가장자리를 자연스레 흐린다
        const s = (0.7 + hash2(gx + 71, gz + 29) * 1.1) * tFade;
        _pos.set(wx, y - 0.12, wz);
        _scl.set(s * wv, s * hv * 0.85, s * wv);
        _m4.compose(_pos, _q, _scl);
        bushes.setMatrixAt(ui, _m4);
        biomeColor(bl, 'treeTop', _tmp).offsetHSL(0,
          (hash2(gx, gz + 9) - 0.5) * 0.20, (hash2(gx + 9, gz) - 0.5) * 0.20);
        const bSnow = snowFactor(wz);
        if (bSnow > 0.01) _tmp.lerp(WHITE, bSnow * (0.68 + hash2(gx + 6, gz + 66) * 0.30));
        bushes.setColorAt(ui, _tmp);
        ui++;
      } else if (r > 0.955 && ri < ROCK_MAX) {
        const s = 0.6 + hash2(gx + 55, gz + 21) * 2.0;
        _pos.set(wx, y + s * 0.22, wz);
        _eul.set(r * 6, r * 3, r * 2);
        _m4.compose(_pos, _q.setFromEuler(_eul), _scl.set(s, s * 0.8, s));
        rocks.setMatrixAt(ri++, _m4);
      }
    }
  }
  _m4.makeScale(0, 0, 0);
  for (let k = ci; k < CONIF_MAX; k++) { trunksC.setMatrixAt(k, _m4); leavesC.setMatrixAt(k, _m4); }
  for (let k = bi; k < BROAD_MAX; k++) { trunksB.setMatrixAt(k, _m4); leavesB.setMatrixAt(k, _m4); }
  for (let k = ri; k < ROCK_MAX;  k++) rocks.setMatrixAt(k, _m4);
  for (let k = ui; k < BUSH_MAX;  k++) bushes.setMatrixAt(k, _m4);
  for (let k = di; k < DEAD_MAX;  k++) deads.setMatrixAt(k, _m4);
  for (let k = si; k < STUMP_MAX; k++) stumps.setMatrixAt(k, _m4);
  for (let k = ki; k < CACTUS_MAX; k++) cacti.setMatrixAt(k, _m4);
  for (let k = kb; k < BARREL_MAX; k++) cactiB.setMatrixAt(k, _m4);
  for (let k = kc; k < COL_MAX;    k++) cactiC.setMatrixAt(k, _m4);
  for (const m of [trunksC, leavesC, trunksB, leavesB, rocks, bushes, deads, stumps, cacti, cactiB, cactiC])
    m.instanceMatrix.needsUpdate = true;
  leavesC.instanceColor.needsUpdate = true;
  leavesB.instanceColor.needsUpdate = true;
  bushes.instanceColor.needsUpdate = true;
}

// ── 풀 — 나무보다 훨씬 촘촘해야 해서 가까운 범위만 따로 깐다
const GCELL = 1.3, GRASS_R = 44;       // 반경 약 57m — 셰이더 페이드(50m)보다 넉넉하게
let grassKey = '';
function scatterGrass() {}          // 풀 없앰 (사용자 요청)

// 가드레일 — 바다·낭떠러지 쪽 갓길에 세운다
const RAIL_STEP = 4.2;
let railKey = null;
function guardrails(pz) {
  const b = Math.round(pz / RAIL_STEP);
  if (b === railKey) return;
  railKey = b;
  let k = 0;
  for (let i = -POST_MAX / 2; i < POST_MAX / 2 && k < POST_MAX; i++) {
    const wz = (b + i) * RAIL_STEP;
    const side = 1;                                    // 오른쪽(바다 쪽)
    const wx = roadX(wz) + side * (ROAD_HALF + 1.6);
    const outer = terrainHeight(wx + side * 8, wz);
    const here = terrainHeight(wx, wz);
    const needs = coastFactor(wz) > 0.25 || here - outer > 4.5;   // 바다이거나 급경사
    if (!needs) continue;
    _pos.set(wx, here, wz);
    const ang = Math.atan2(roadX(wz + 3) - roadX(wz - 3), 6);
    _q.setFromAxisAngle(_axis, ang);
    _scl.set(1, 1, 1);
    _m4.compose(_pos, _q, _scl);
    posts.setMatrixAt(k, _m4); rails.setMatrixAt(k, _m4);
    k++;
  }
  _m4.makeScale(0, 0, 0);
  for (let i = k; i < POST_MAX; i++) { posts.setMatrixAt(i, _m4); rails.setMatrixAt(i, _m4); }
  posts.instanceMatrix.needsUpdate = true;
  rails.instanceMatrix.needsUpdate = true;
}

// ═══════════════════════════════════════════════════════════
//  노면 — 도로만 따로 띠(ribbon) 메시로 깔고 차선을 픽셀 단위로 그린다.
//  지형 정점(약 4.4m 간격)으로는 15cm 차선을 표현할 수 없어서 분리했다.
//  MeshStandardMaterial 을 onBeforeCompile 로 고쳐 쓰므로
//  그림자·안개·톤매핑은 three 의 기본 파이프라인을 그대로 탄다.
// ═══════════════════════════════════════════════════════════
const LANE_W = ROAD_HALF;              // 편도 1차로 (왕복 2차로, 차로폭 3.6m)
const ROAD_EDGE = ROAD_HALF + SHOULDER_W;   // 갓길 바깥 끝 — 여기서 지형 색과 만난다
const roadUniforms = {
  uWet:    { value: 0 },
  uGround: { value: new THREE.Color(0x7a9f57) },   // 갓길이 이어질 땅 색(바이옴 따라 변함)
};

const roadMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.94, metalness: 0.0,
});
roadMat.envMapIntensity = 0.55;
roadMat.onBeforeCompile = shader => {
  shader.uniforms.uWet = roadUniforms.uWet;
  shader.uniforms.uGround = roadUniforms.uGround;
  shader.uniforms.uDetail = detailU;

  shader.vertexShader = `
    attribute float aU;
    varying float vU;
    varying vec3 vWPos;
  ` + shader.vertexShader.replace('#include <project_vertex>', `
    #include <project_vertex>
    vU = aU;
    vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
  `);

  shader.fragmentShader = `
    uniform float uWet;
    uniform float uDetail;
    uniform vec3 uGround;
    varying float vU;
    varying vec3 vWPos;

    float rh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float rn(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(rh(i), rh(i + vec2(1,0)), f.x),
                 mix(rh(i + vec2(0,1)), rh(i + vec2(1,1)), f.x), f.y);
    }
    // 가로 방향 띠 하나 — 화면상 폭으로 안티에일리어싱해서 멀리서도 안 깜빡인다
    float rband(float x, float c, float hw){
      float d = abs(x - c) - hw;
      float w = max(fwidth(x), 1e-4) * 0.8;
      return 1.0 - smoothstep(-w, w, d);
    }
    // 점선 — 주기 period 중 duty 만큼만 칠한다
    float rdash(float z, float period, float duty){
      float t = fract(z / period);
      float w = fwidth(t);
      if (w > 0.3) return duty;              // 아주 멀면 평균값으로 뭉갠다
      return smoothstep(duty + w, duty - w, t);
    }
  ` + shader.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>

    float rU = vU;
    float aU = abs(rU);
    vec2  rp = vec2(rU, vWPos.z);

    // 아스팔트 — 아주 큰 얼룩부터 잔알갱이까지 겹쳐 같은 무늬가 반복돼 보이지 않게 한다
    float blotch = rn(rp * 0.035) * 0.6 + rn(rp * 0.11) * 0.4;      // 넓게 퍼진 색 얼룩만 남긴다
    float grain  = mix(0.5, rn(rp * 0.9) * 0.6 + rn(rp * 3.7) * 0.4, uDetail);  // 빠르면 잔알갱이를 걷는다
    vec3 col = mix(vec3(0.200, 0.205, 0.220), vec3(0.250, 0.255, 0.272), grain);
    col *= 0.94 + 0.12 * blotch;

    // 바퀴가 지나간 자리 — 차로 중앙 좌우로 살짝 닳는다
    float wear = clamp(rband(aU, 1.45, 0.45) + rband(aU, 3.30, 0.45), 0.0, 1.0);
    col *= 1.0 - 0.06 * wear;

    // ── 차선: 왕복 2차로 지방도 = 중앙 황색 복선 + 양쪽 가장자리 백색 실선
    float yl = clamp(rband(rU, -0.16, 0.075) + rband(rU, 0.16, 0.075), 0.0, 1.0);
    float wl = rband(aU, ${(ROAD_HALF - 0.42).toFixed(3)}, 0.085);

    float pw = 0.80 + 0.20 * grain;          // 마모는 살짝만 — 선명도는 지킨다
    col = mix(col, vec3(0.93, 0.93, 0.90), wl * pw);
    col = mix(col, vec3(0.97, 0.76, 0.14), yl * pw);
    float paint = clamp(wl + yl, 0.0, 1.0);

    // ── 아스팔트 → 흙 갓길 → 풀. 경계를 노이즈로 흩지 않고 곧게 끊는다.
    //    (fwidth 로 화면 폭만큼만 부드럽게 = 멀리서도 계단이 안 지는 깔끔한 직선)
    float ew = max(fwidth(aU), 0.20);
    float edge = smoothstep(${ROAD_HALF.toFixed(3)} - ew, ${ROAD_HALF.toFixed(3)} + ew, aU);
    col = mix(col, mix(vec3(0.40, 0.36, 0.30), uGround * 0.8, 0.35), edge);
    // 갓길 바깥 끝에서 땅 색과 정확히 만난다 → 지형 메시와의 이음매가 안 보인다
    float toGrass = smoothstep(${(ROAD_EDGE - 1.0).toFixed(3)}, ${ROAD_EDGE.toFixed(3)}, aU);
    col = mix(col, uGround, toGrass);

    float onRoad = 1.0 - edge;               // 흙 갓길은 젖어도 안 반짝인다
    col *= mix(1.0, mix(1.0, 0.55, onRoad), uWet);
    diffuseColor.rgb = col;

    float rRough = mix(mix(0.93, 0.70, paint), 0.16, uWet * onRoad);   // 젖으면 거울처럼 반사한다
  `).replace('#include <roughnessmap_fragment>', `
    #include <roughnessmap_fragment>
    roughnessFactor = rRough;
  `);
};

const ROAD_SEG = 2, ROAD_BACK = 150, ROAD_FWD = 600;
const ROAD_ROWS = Math.round((ROAD_BACK + ROAD_FWD) / ROAD_SEG) + 1;
const ROAD_COLS = 17;
const ROAD_LIFT = 0.30;                // 평평한 지형 위로 확실히 띄운다 (관통 방지)

// 도로 중심선 기준 '법선 방향' 가로 오프셋. 커브에서 도로 메시는 법선 방향으로 깔리므로
// 단순히 (x - roadX(z)) 로 재면 곡선 구간에서 실제 노면 폭과 어긋난다.
function roadU(x, z) {
  const dx = (roadX(z + 1) - roadX(z - 1)) / 2;
  return (x - roadX(z)) * Math.hypot(1, dx);   // u * nx = Δx  →  u = Δx / nx
}
// updateRoad() 가 노면 정점에 주는 lift 와 '똑같은' 식. 차가 이걸 써야 노면에 딱 붙는다.
function roadLift(u) {
  const a = Math.abs(u);
  const cd = Math.min(a, ROAD_HALF) / ROAD_HALF;
  return (ROAD_LIFT - cd * cd * 0.12) * (1 - smooth((a - ROAD_HALF) / SHOULDER_W));
}

const roadGeo = new THREE.BufferGeometry();
{
  const n = ROAD_ROWS * ROAD_COLS;
  roadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  roadGeo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  roadGeo.setAttribute('aU',       new THREE.BufferAttribute(new Float32Array(n), 1));
  const idx = [];
  for (let r = 0; r < ROAD_ROWS - 1; r++)
    for (let c = 0; c < ROAD_COLS - 1; c++) {
      const a = r * ROAD_COLS + c, b = a + 1, d = a + ROAD_COLS, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  roadGeo.setIndex(idx);
}
const roadMesh = new THREE.Mesh(roadGeo, roadMat);
roadMesh.receiveShadow = true;
roadMesh.frustumCulled = false;
scene.add(roadMesh);

let roadKey = null;
function updateRoad(pz) {
  const b = Math.round(pz / 8);
  if (b === roadKey) return;
  roadKey = b;
  const z0 = b * 8 - ROAD_BACK;
  const pos = roadGeo.attributes.position, au = roadGeo.attributes.aU;

  for (let r = 0; r < ROAD_ROWS; r++) {
    const cz = z0 + r * ROAD_SEG;
    const rx = roadX(cz);
    // 접선 (dx, 1) → 법선 (1, -dx). 이 방향으로 폭을 깔아야 커브에서도 폭이 일정하고
    // 가장자리가 부드러운 곡선으로 이어진다.
    const dx = (roadX(cz + 1) - roadX(cz - 1)) / 2;
    const nl = Math.hypot(1, dx), nx = 1 / nl, nz = -dx / nl;
    for (let c = 0; c < ROAD_COLS; c++) {
      const u = -ROAD_EDGE + (2 * ROAD_EDGE) * (c / (ROAD_COLS - 1));
      const wx = rx + u * nx, wz = cz + u * nz;
      // 갓길 바깥 끝에서는 띄움을 0으로 없앤다 → 지형 위에 떠 있는 것처럼 보이지 않는다
      // 가운데가 볼록한 캠버를 도로 메시 자체가 만든다. 갓길 바깥에서 0으로 잦아든다.
      const cd = Math.min(Math.abs(u), ROAD_HALF) / ROAD_HALF;
      const lift = (ROAD_LIFT - cd * cd * 0.12)
        * (1 - smooth((Math.abs(u) - ROAD_HALF) / SHOULDER_W));
      const i = r * ROAD_COLS + c;
      pos.setXYZ(i, wx, terrainHeight(wx, wz) + lift, wz);
      au.setX(i, u);
    }
  }
  pos.needsUpdate = true; au.needsUpdate = true;
  roadGeo.computeVertexNormals();
}

// ═══════════════════════════════════════════════════════════
//  차량 (외장 + 실내)
// ═══════════════════════════════════════════════════════════
// 탈것은 이 한 대뿐이다.
const CAR = { name: '스포츠', color: 0xc9453c, len: 4.5, w: 1.95, h: 1.1, top: 46.7, acc: 34, grip: 1.15 };

// 모서리를 둥글린 상자. 각 정점을 안쪽 상자에 붙인 뒤 반지름만큼 밀어내면 된다.
// 하이라이트가 모서리를 타고 흐르기 시작해서 플라스틱 블록 느낌이 사라진다.
function roundedBox(w, h, d, r, seg = 4) {
  r = Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3);
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const p = g.attributes.position;
  const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r;
  const v = new THREE.Vector3(), c = new THREE.Vector3();
  const cl = (x, m) => Math.max(-m, Math.min(m, x));
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i), p.getY(i), p.getZ(i));
    c.set(cl(v.x, hw), cl(v.y, hh), cl(v.z, hd));
    v.sub(c).normalize().multiplyScalar(r).add(c);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

const carRoot = new THREE.Group();
scene.add(carRoot);

// 탈것을 바꿀 때 옛 것을 놓아준다. 씬에서 빼기만 하면 지오메트리·재질이 GPU 에 그대로 남는다.
function disposeTree(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
}

// 바퀴 한 벌을 찍어내는 틀.
// 실린더는 기본 축이 Y 라 미리 Z 로 90° 눕혀 축을 X(좌우)에 맞춘다.
// 그러면 바퀴 그룹의 rotation.x = 구르기, rotation.y = 조향으로 깔끔하게 갈린다.
function wheelKit(wheelR, width) {
  const treadG = new THREE.CylinderGeometry(wheelR, wheelR, width, 20, 1);            treadG.rotateZ(Math.PI / 2);
  // ⚠ 폭을 서로 다르게 준다 — 옆면이 정확히 같은 평면이면 깊이값이 같아 지지직거린다(z-파이팅).
  const rimG   = new THREE.CylinderGeometry(wheelR * 0.60, wheelR * 0.60, width * 0.92, 16, 1); rimG.rotateZ(Math.PI / 2);
  const hubG   = new THREE.CylinderGeometry(wheelR * 0.17, wheelR * 0.17, width * 1.05, 10, 1); hubG.rotateZ(Math.PI / 2);
  const spokeG = new THREE.BoxGeometry(width * 0.96, wheelR * 1.02, wheelR * 0.21);
  const tyre = new THREE.MeshStandardMaterial({ color: 0x1a1b1f, roughness: 0.95, metalness: 0.0 });
  const rim  = new THREE.MeshStandardMaterial({ color: 0xb6bcc2, roughness: 0.22, metalness: 0.95 });
  spokeMat = new THREE.MeshStandardMaterial({ color: 0xb6bcc2, roughness: 0.22, metalness: 0.95,
                                              transparent: false, opacity: 1, depthWrite: true });
  wheelRadius = wheelR;
  return (x, y, z, front) => {
    const w = new THREE.Group();
    w.position.set(x, y, z);
    const roll = new THREE.Group();          // 구르기 전용 — 조향(w.rotation.y)과 섞이지 않게 분리
    roll.add(new THREE.Mesh(treadG, tyre), new THREE.Mesh(rimG, rim), new THREE.Mesh(hubG, rim));
    for (let i = 0; i < 5; i++) {            // 스포크가 있어야 도는 게 눈에 보인다
      const sp = new THREE.Mesh(spokeG, spokeMat);
      sp.rotation.x = (i / 5) * Math.PI;
      roll.add(sp);
    }
    w.add(roll);
    w.userData.roll = roll;
    w.userData.front = front;
    wheels.push(w);
    return w;
  };
}

// 브레이크등 재질 하나 — 밟으면 loop 에서 밝아진다
function brakeMat() {
  const m = new THREE.MeshStandardMaterial({ color: 0x6d1a14, emissive: 0xff2a12, emissiveIntensity: 0.35 });
  brakeMats.push(m);
  return m;
}

// 헤드라이트(실제로 길을 비추는 빛) 하나
function addHeadlight(x, y, z, aimX) {
  const sp = new THREE.SpotLight(0xfff0cc, 0, 150, 0.5, 0.6, 1.4);
  sp.position.set(x, y, z);
  sp.target.position.set(aimX, -2.4, 34);
  carRoot.add(sp, sp.target);
  headlights.push(sp);
}

// 옛 탈것을 걷어내고 전역을 초기화한다
function clearVehicle() {
  if (carBody) { carRoot.remove(carBody); disposeTree(carBody); }
  if (interior) { carRoot.remove(interior); disposeTree(interior); }
  headlights.forEach(h => carRoot.remove(h, h.target));
  headlights = []; brakeMats = []; dashMats = []; wheels = [];
  steerWheel = null; carBody = null; interior = null;
}
let carBody = null, interior = null, headlights = [], brakeMats = [], dashMats = [];
let steerWheel = null, eyePoint = new THREE.Vector3();
let wheels = [], wheelRadius = 0.36, wheelRoll = 0, spokeMat = null;   // 바퀴 4개 · 반지름 · 구른 각도

function buildCar(spec) {
  clearVehicle();

  const g = new THREE.Group();
  // 자동차 도장 = 색층 + 그 위의 맑은 클리어코트. 하이라이트가 두 겹으로 잡혀야 차처럼 보인다.
  const paint = new THREE.MeshPhysicalMaterial({ color: spec.color, roughness: 0.38, metalness: 0.55,
    clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.15 });
  const trim  = new THREE.MeshStandardMaterial({ color: 0x1e1f24, roughness: 0.55, metalness: 0.35 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x9ec2d8, roughness: 0.04, metalness: 0.0,
    transparent: true, opacity: 0.34, envMapIntensity: 2.0, side: THREE.DoubleSide });
  const lamp  = new THREE.MeshStandardMaterial({ color: 0xfff6dd, emissive: 0xfff0c8, emissiveIntensity: 1.2 });

  const wheelR = spec.h * 0.33;
  const bodyY = wheelR + spec.h * 0.3;

  // 차체 — 각진 네모 블록 (사용자 요청)
  const body = new THREE.Mesh(new THREE.BoxGeometry(spec.w, spec.h * 0.56, spec.len), paint);
  body.position.y = bodyY;

  // ⚠ 붙어 있는 블록끼리 면을 '정확히' 맞추면 안 된다. 깊이값이 완전히 같아지면
  //   프레임마다 어느 면이 이길지 뒤바뀌며 지지직 깜빡인다(z-파이팅).
  //   예전엔 캐빈 바닥 = 차체 윗면, 지붕 옆면 = 캐빈 옆면, 스커트 폭 = 차체 폭,
  //   휠 아치 바깥면 = 차체 옆면 이 전부 같은 평면이었다. 조금씩 어긋나게 둔다.
  const cabinH = spec.h * 0.5, cabinY = bodyY + spec.h * 0.28 + cabinH / 2 - 0.035;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 0.88, cabinH, spec.len * 0.52), glass);
  cabin.position.set(0, cabinY, -spec.len * 0.04);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 0.898, 0.09, spec.len * 0.531), paint);
  roof.position.set(0, cabinY + cabinH / 2, -spec.len * 0.04);   // 캐빈보다 아주 조금 크게
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 1.016, spec.h * 0.16, spec.len * 0.86), trim);
  skirt.position.y = bodyY - spec.h * 0.3;
  g.add(body, cabin, roof, skirt);

  // 앞뒤 범퍼
  for (const sz of [1, -1]) {
    const bump = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 0.9, 0.2, 0.22), trim);
    bump.position.set(0, bodyY - spec.h * 0.16, sz * spec.len * 0.49);
    g.add(bump);
  }
  // 휠 아치 — 바퀴 위를 덮어 주면 단번에 차 같아진다
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const arch = new THREE.Mesh(
      new THREE.BoxGeometry(0.20, 0.1, wheelR * 2.6), trim);
    // 튀어나온 타이어까지 덮도록 넓히고 바깥으로 뺀다(바깥 끝 = 차체면 +8cm > 타이어 +7cm)
    arch.position.set(sx * (spec.w * 0.5 - 0.02), wheelR * 1.02, sz * spec.len * 0.32);
    g.add(arch);
  }

  for (const sx of [-1, 1]) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.12), lamp);
    l.position.set(sx * spec.w * 0.31, bodyY + 0.05, spec.len * 0.49);
    g.add(l);
    const sp = new THREE.SpotLight(0xfff0cc, 0, 150, 0.5, 0.6, 1.4);
    sp.position.set(sx * spec.w * 0.32, bodyY, spec.len * 0.5);
    sp.target.position.set(sx * 3, -2.4, 34);
    carRoot.add(sp, sp.target);
    headlights.push(sp);

    const bm = new THREE.MeshStandardMaterial({ color: 0x6d1a14, emissive: 0xff2a12, emissiveIntensity: 0.35 });
    brakeMats.push(bm);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.15, 0.1), bm);
    t.position.set(sx * spec.w * 0.31, bodyY + 0.08, -spec.len * 0.49);
    g.add(t);

    // 사이드미러 — 지지대 + 거울면
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.04, 0.04), trim);
    arm.position.set(sx * spec.w * 0.5, cabinY - 0.04, spec.len * 0.15);
    const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.1, 0.07), trim);
    mirror.position.set(sx * spec.w * 0.58, cabinY - 0.02, spec.len * 0.15);
    g.add(arm, mirror);
  }

  // 배기구
  for (const sx of [-1, 1]) {
    const ex = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.14),
      new THREE.MeshStandardMaterial({ color: 0x8b9095, roughness: 0.35, metalness: 0.9 }));
    ex.position.set(sx * spec.w * 0.28, bodyY - spec.h * 0.24, -spec.len * 0.51);
    g.add(ex);
  }

  // ── 바퀴: 둥근 타이어 + 림. 굴러가고, 앞바퀴는 조향까지 한다.
  //    실린더는 기본 축이 Y 라 지오메트리를 미리 Z 로 90° 눕혀 축을 X(차 좌우)로 맞춘다.
  //    그러면 바퀴 그룹의 rotation.x = 구르기, rotation.y = 조향으로 깔끔하게 나뉜다.
  const treadG = new THREE.CylinderGeometry(wheelR, wheelR, 0.26, 20, 1);
  treadG.rotateZ(Math.PI / 2);
  // ⚠ 폭을 서로 다르게 준다. 예전엔 스포크(0.30)와 허브(0.30)의 옆면이 정확히 같은 평면이라
  //   깊이값이 완전히 같아 프레임마다 어느 쪽이 이길지 뒤바뀌었다(z-파이팅 = 지지직 깜빡임).
  const rimG = new THREE.CylinderGeometry(wheelR * 0.60, wheelR * 0.60, 0.284, 16, 1);
  rimG.rotateZ(Math.PI / 2);
  const hubG = new THREE.CylinderGeometry(wheelR * 0.17, wheelR * 0.17, 0.300, 10, 1);
  hubG.rotateZ(Math.PI / 2);
  const spokeG = new THREE.BoxGeometry(0.292, wheelR * 1.02, 0.075);
  const tyre = new THREE.MeshStandardMaterial({ color: 0x1a1b1f, roughness: 0.95, metalness: 0.0 });
  const rim  = new THREE.MeshStandardMaterial({ color: 0xb6bcc2, roughness: 0.22, metalness: 0.95 });
  spokeMat = new THREE.MeshStandardMaterial({ color: 0xb6bcc2, roughness: 0.22, metalness: 0.95,
                                              transparent: false, opacity: 1, depthWrite: true });
  wheels = [];
  wheelRadius = wheelR;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const w = new THREE.Group();
    // 타이어 바깥면이 차체 옆면보다 7cm 정도 튀어나오게 — 예전엔 차체와 정확히 같은 면이라
    // 바퀴가 몸통에 파묻혀 보였다(그리고 그 자체가 z-파이팅 거리였다).
    w.position.set(sx * (spec.w * 0.5 - 0.06), wheelR, sz * spec.len * 0.32);
    const roll = new THREE.Group();          // 구르기 전용 — 조향(w.rotation.y)과 섞이지 않게 분리
    roll.add(new THREE.Mesh(treadG, tyre), new THREE.Mesh(rimG, rim), new THREE.Mesh(hubG, rim));
    // 스포크가 있어야 도는 게 눈에 보인다. 다만 빠르면 스포크가 프레임보다 빨리 돌아
    // 거꾸로 도는 것처럼 보이므로(마차바퀴 현상) 속도가 붙으면 서서히 지운다.
    for (let i = 0; i < 5; i++) {
      const sp = new THREE.Mesh(spokeG, spokeMat);
      sp.rotation.x = (i / 5) * Math.PI;
      roll.add(sp);
    }
    w.add(roll);
    w.userData.roll = roll;
    w.userData.front = sz > 0;
    wheels.push(w);
    g.add(w);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  carRoot.add(g);
  carBody = g;

  // ── 실내 (1인칭에서만 보인다)
  const inte = new THREE.Group();
  const plastic = new THREE.MeshStandardMaterial({ color: 0x2a2c31, roughness: 0.85 });
  const seatMat = new THREE.MeshStandardMaterial({ color: 0x3a3138, roughness: 0.95 });
  const dashGlow = new THREE.MeshStandardMaterial({ color: 0x101216, roughness: 0.6,
    emissive: 0x4fd6c8, emissiveIntensity: 0.0 });
  dashMats.push(dashGlow);

  const dashY = bodyY + spec.h * 0.2;
  const dash = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 0.88, 0.3, 0.62), plastic);
  dash.position.set(0, dashY, spec.len * 0.19);
  const cluster = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.06), dashGlow);
  cluster.position.set(-spec.w * 0.24, dashY + 0.13, spec.len * 0.19 - 0.3);
  cluster.rotation.x = 0.35;
  const centerScr = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.24, 0.05), dashGlow);
  centerScr.position.set(spec.w * 0.1, dashY + 0.16, spec.len * 0.19 - 0.28);
  centerScr.rotation.x = 0.2;
  inte.add(dash, cluster, centerScr);

  steerWheel = new THREE.Group();
  const rimW = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.024, 8, 24), plastic);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 10).rotateX(Math.PI / 2), plastic);
  for (const a of [0, 2.1, 4.2]) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.022, 0.02), plastic);
    spoke.position.set(Math.cos(a) * 0.085, Math.sin(a) * 0.085, 0);
    spoke.rotation.z = a;
    steerWheel.add(spoke);
  }
  steerWheel.add(rimW, hub);
  steerWheel.position.set(-spec.w * 0.24, dashY + 0.16, spec.len * 0.19 - 0.42);
  steerWheel.rotation.x = -0.42;
  inte.add(steerWheel);

  // A필러 · 도어 · 루프 라이닝
  for (const sx of [-1, 1]) {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.1, cabinH * 1.25, 0.12), plastic);
    pillar.position.set(sx * spec.w * 0.42, cabinY - 0.03, spec.len * 0.24);
    pillar.rotation.x = -0.42;
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.5, spec.len * 0.5), plastic);
    door.position.set(sx * spec.w * 0.44, bodyY + 0.16, 0);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.62, 0.16), seatMat);
    seat.position.set(sx * spec.w * 0.24, bodyY + 0.3, -spec.len * 0.14);
    seat.rotation.x = -0.12;
    inte.add(pillar, door, seat);
  }
  const lining = new THREE.Mesh(new THREE.BoxGeometry(spec.w * 0.86, 0.05, spec.len * 0.46), plastic);
  lining.position.set(0, cabinY + cabinH / 2 - 0.05, -spec.len * 0.06);
  const rearMirror = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.09, 0.04), plastic);
  rearMirror.position.set(0, cabinY + cabinH / 2 - 0.14, spec.len * 0.2);
  inte.add(lining, rearMirror);

  carRoot.add(inte);
  interior = inte;

  // 운전석 눈높이
  eyePoint.set(-spec.w * 0.24, cabinY + 0.02, spec.len * 0.19 - 0.75);
}
