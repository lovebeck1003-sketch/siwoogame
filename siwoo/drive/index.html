// ═══════════════════════════════════════════════════════════
//  후처리 — 씬을 렌더 타깃에 한 번 그리고, 전체 화면 셰이더로 마무리한다. P 키로 토글.
//  ① 깊이 기반 앰비언트 오클루전(약하게) ② 부드러운 색보정 ③ 비네트
//  ④ 고속에서만 아주 옅은 방사형 모션 블러. Bloom 처럼 화면을 뿌옇게 만드는 건 안 넣었다.
// ═══════════════════════════════════════════════════════════
let postOn = false;   // 각진 그래픽에는 후처리가 안 어울린다 (P 키로 켤 수 있음)
function makeRT() {
  // 타깃은 선형(HalfFloat)으로 둔다. sRGB 로 굽는 건 후처리 셰이더의 toSRGB 한 곳에서만
  // 한다 — 여기서도 sRGB 로 두면 감마가 두 번 먹어 어두운 아스팔트가 하얗게 뜬다.
  // ⚠ three 는 렌더타깃에 depthTexture 를 붙이면 MSAA(samples)를 못 쓴다.
  //   그래서 후처리를 켜면 계단(에일리어싱)이 그대로 남아 차 모서리가 깨져 보였다.
  //   → 타깃을 화면보다 RT_SS 배 크게 그린 뒤 화면 해상도로 줄여서(수퍼샘플링) 매끈하게 만든다.
  const rt = new THREE.WebGLRenderTarget(
    Math.max(2, Math.floor(innerWidth * renderer.getPixelRatio() * RT_SS)),
    Math.max(2, Math.floor(innerHeight * renderer.getPixelRatio() * RT_SS)),
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: THREE.HalfFloatType, samples: 4 });
  rt.depthTexture = new THREE.DepthTexture(rt.width, rt.height, THREE.UnsignedIntType);
  return rt;
}
let sceneRT = null;
try { sceneRT = makeRT(); } catch (e) { postOn = false; console.warn('후처리 렌더타깃 실패', e); }

const postMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    tDiffuse: { value: sceneRT && sceneRT.texture },
    tDepth:   { value: sceneRT && sceneRT.depthTexture },
    uTexel:   { value: new THREE.Vector2(1 / (sceneRT ? sceneRT.width : 1),
                                         1 / (sceneRT ? sceneRT.height : 1)) },
    uNear:    { value: camera.near },
    uFar:     { value: camera.far },
    uBlur:    { value: 0 },
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tDepth;
    uniform vec2 uTexel; uniform float uNear, uFar, uBlur;
    varying vec2 vUv;

    // 깊이 버퍼는 비선형이라 미터 단위로 되돌려야 거리 비교가 맞는다
    float linDepth(vec2 uv){
      float z = texture2D(tDepth, uv).x * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    vec3 toSRGB(vec3 c){
      return mix(c * 12.92, 1.055 * pow(max(c, 1e-5), vec3(1.0/2.4)) - 0.055,
                 step(0.0031308, c));
    }

    void main(){
      float d = linDepth(vUv);

      // 큰 타깃을 화면 크기로 줄여 읽는다 — 네 점을 평균해 계단을 지운다
      vec2 o = uTexel * 0.5;
      vec3 col = (texture2D(tDiffuse, vUv + vec2( o.x,  o.y)).rgb +
                  texture2D(tDiffuse, vUv + vec2(-o.x,  o.y)).rgb +
                  texture2D(tDiffuse, vUv + vec2( o.x, -o.y)).rgb +
                  texture2D(tDiffuse, vUv + vec2(-o.x, -o.y)).rgb) * 0.25;
      if (uBlur > 0.002) {                      // 화면 중심에서 바깥으로 몇 점 더 뽑아 섞는다
        vec2 dir = (vUv - 0.5) * uBlur;
        float w = 1.0;
        for (int i = 1; i <= 4; i++) {
          float t = float(i) / 4.0;
          col += texture2D(tDiffuse, vUv - dir * t).rgb * (1.0 - t * 0.5);
          w += 1.0 - t * 0.5;
        }
        col /= w;
      }

      // ── 앰비언트 오클루전: 주변보다 움푹 들어간 픽셀을 조금 어둡게
      if (d < 120.0) {
        float r = clamp(9.0 / d, 0.6, 4.0);
        float occ = 0.0;
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.7854;
          vec2 o = vec2(cos(a), sin(a)) * uTexel * r * (1.0 + mod(float(i), 3.0) * 0.6);
          float diff = d - linDepth(vUv + o);
          occ += clamp(diff - 0.03, 0.0, 0.6) * step(diff, 2.5);
        }
        occ = clamp(occ / 8.0 * 1.9, 0.0, 0.42) * (1.0 - smoothstep(70.0, 120.0, d));
        col *= 1.0 - occ;
      }

      // ── 부드러운 색보정: 아주 약한 S커브 + 그림자를 살짝 차갑게
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * col * (3.0 - 2.0 * col), 0.16);
      col += vec3(0.008, 0.011, 0.020) * (1.0 - lum);
      col *= mix(vec3(0.98, 0.99, 1.02), vec3(1.02, 1.00, 0.98), lum);

      // ── 비네트: 가장자리를 살짝만 눌러 시선이 도로 중앙에 머물게
      col *= 1.0 - smoothstep(0.45, 0.95, distance(vUv, vec2(0.5, 0.52))) * 0.28;

      gl_FragColor = vec4(toSRGB(max(col, 0.0)), 1.0);
    }`,
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
postQuad.frustumCulled = false;
const postScene = new THREE.Scene().add(postQuad);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function resizeRT() {
  if (!sceneRT) return;
  sceneRT.dispose(); sceneRT.depthTexture.dispose();
  sceneRT = makeRT();
  postMat.uniforms.tDiffuse.value = sceneRT.texture;
  postMat.uniforms.tDepth.value = sceneRT.depthTexture;
  postMat.uniforms.uTexel.value.set(1 / sceneRT.width, 1 / sceneRT.height);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const spec = CAR;

  const w = WEATHER[weatherIdx];
  for (const k in wMix) wMix[k] += (w[k] - wMix[k]) * Math.min(1, dt * 0.7);

  // ── 조작 · 물리
  const boost = keys.ShiftLeft || keys.ShiftRight;
  const throttle = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const steerIn = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0);

  const carU = roadU(car.x, car.z);
  const offRoad = Math.abs(carU) > ROAD_HALF;
  const inWater = car.y < seaY(car.z) + 0.6;
  const topSpeed = spec.top * (boost ? 1.2 : 1) * (offRoad ? 0.62 : 1) * (inWater ? 0.25 : 1);
  const gripNow = spec.grip * wMix.grip * (offRoad ? 0.72 : 1);

  car.speed += throttle * spec.acc * (throttle > 0 ? 1 : 1.4) * dt;
  if (throttle === 0 && !keys.Space && !inWater && !offRoad && car.speed > 0) {
    // 가속을 안 눌러도 순항 속도(100km/h)까지는 유지한다 — 그 위로만 공기저항으로 떨어진다
    const cruise = Math.min(CRUISE, topSpeed);
    car.speed = car.speed > cruise
      ? cruise + (car.speed - cruise) * Math.pow(0.86, dt)
      : car.speed + (cruise - car.speed) * Math.min(1, dt * 0.5);
  } else {
    car.speed *= Math.pow(inWater ? 0.25 : offRoad ? 0.55 : 0.86, dt);
  }
  const braking = keys.Space || (throttle < 0 && car.speed > 1);
  if (keys.Space) {
    // 지수 감쇠만 쓰면 0 에 점근할 뿐 끝내 멈추지 않아서 계속 앞으로 스멀스멀 갔다.
    // 감쇠에 더해 일정한 제동력(BRAKE_FORCE)을 빼고, 아주 느려지면 완전히 세운다.
    car.speed *= Math.pow(0.06, dt);
    const drop = BRAKE_FORCE * dt;
    car.speed = Math.abs(car.speed) <= drop ? 0
              : car.speed - Math.sign(car.speed) * drop;
  }
  car.speed = Math.max(-topSpeed * 0.35, Math.min(topSpeed, car.speed));

  const steerTarget = steerIn * Math.min(1, 26 / (Math.abs(car.speed) + 12));
  car.steer += (steerTarget - car.steer) * Math.min(1, dt * 7);

  // ── 코너링 감속 ──────────────────────────────────────────
  // 조향각이 정해지면 요레이트 ω = steer * 0.055 * grip * v 이고, 횡가속도는 a = v·ω 다.
  // 즉 a = (steer*0.055*grip) * v². 타이어가 버틸 수 있는 한계 MAX_LAT 을 넘으면
  // 그 코너를 그 속도로 돌 수 없다는 뜻 → 한계 속도까지 서서히 깎는다.
  const yawK = Math.abs(car.steer) * 0.055;             // ω / v (그립과 무관한 기하 항)
  if (yawK > 1e-4) {
    // 한계는 그립에 비례한다 — 비가 오거나(wMix.grip) 흙길이면(offRoad) 더 일찍 감속
    const cornerTop = Math.sqrt(MAX_LAT * gripNow / yawK);
    const sp = Math.abs(car.speed);
    if (sp > cornerTop) {
      // 한계를 넘은 만큼만, 프레임레이트 독립으로 지수 감쇠시킨다
      const over = sp - cornerTop;
      car.speed -= Math.sign(car.speed) * over * (1 - Math.pow(CORNER_GRIP_FALL, dt));
    }
  }
  // 한계 안쪽이라도 조향 중엔 타이어가 옆으로 긁히며 조금씩 속도를 잃는다
  if (Math.abs(car.steer) > 0.01) car.speed *= Math.pow(1 - CORNER_SCRUB * Math.abs(car.steer), dt);

  car.heading += car.steer * car.speed * 0.055 * gripNow * dt;

  // ── 살짝 미끄러지는 느낌 ────────────────────────────────
  // 실제 진행 방향(moveDir)이 차가 향한 방향(heading)을 조금 늦게 따라온다.
  // 그래서 코너 진입에서 차가 아주 살짝 바깥으로 흘렀다가 물린다.
  // 그립이 낮을수록(비·흙길) 더 늦게 따라와 = 더 미끄럽다.
  let dh = car.heading - moveDir;
  dh = Math.atan2(Math.sin(dh), Math.cos(dh));        // -π~π 로 감아 준다
  dh = Math.max(-SLIDE_MAX, Math.min(SLIDE_MAX, dh)); // 너무 벌어지면 붙잡는다
  moveDir = car.heading - dh * Math.pow(SLIDE_HOLD, dt * gripNow);

  car.x += Math.sin(moveDir) * car.speed * dt;
  car.z += Math.cos(moveDir) * car.speed * dt;
  car.spin += car.speed * dt * 0.6;

  // 노면 lift 를 도로 메시와 같은 식으로 계산 → 갓길에서 부드럽게 0 이 되므로
  // 도로를 벗어나는 순간 30cm 가 툭 꺼지던 현상이 없어진다.
  const gy = terrainHeight(car.x, car.z) + roadLift(carU);
  // 예전엔 `dt*12` 라 지면이 빠르게 꺼지는 곳(언덕 마루·급내리막·오프로드)에서
  // 차가 지면을 못 따라가 공중에 뜬 채로 날아가 보였다. 감쇠를 프레임레이트 독립으로
  // 바꾸고, 무엇보다 지면에서 뜰 수 있는 높이를 GROUND_SLACK 로 못 박는다.
  car.y += (gy - car.y) * (1 - Math.pow(1e-6, dt));
  car.y = Math.min(Math.max(car.y, gy), gy + GROUND_SLACK);
  const rumble = offRoad ? Math.sin(car.spin * 9) * 0.05 * Math.min(1, Math.abs(car.speed) / 20) : 0;
  carRoot.position.set(car.x, car.y + rumble, car.z);

  // 지형 법선을 그대로 쓰면 잔주름 하나하나에 차체가 튀어 화면이 덜컹거린다.
  // 실제 서스펜션처럼 시간을 두고 따라가게 한다(프레임레이트 독립).
  _up.copy(terrainNormal(car.x, car.z));
  nrmS.lerp(_up, 1 - Math.pow(BODY_SETTLE, dt)).normalize();
  _up.copy(nrmS);
  _fwd.set(Math.sin(car.heading), 0, Math.cos(car.heading));
  _fwd.addScaledVector(_up, -_fwd.dot(_up)).normalize();
  _right.crossVectors(_up, _fwd).normalize();
  carRoot.quaternion.setFromRotationMatrix(_basis.makeBasis(_right, _up, _fwd));
  carRoot.rotateZ(-car.steer * Math.min(0.1, Math.abs(car.speed) * 0.0022));
  if (steerWheel) steerWheel.rotation.z = car.steer * 2.6;
  // 바퀴 굴리기 — 구른 각도 = 이동거리 / 반지름. 앞바퀴는 조향각도 함께 준다.
  wheelRoll = (wheelRoll + car.speed * dt / wheelRadius) % (Math.PI * 2);
  if (spokeMat) {   // 시속 20~50km 구간에서 스포크를 지운다 → 빠를 땐 매끈한 원반으로 보인다
    const o = 1 - smooth((Math.abs(car.speed) * 2.14 - 20) / 30);
    spokeMat.opacity = o;
    // 완전히 불투명할 땐 transparent 를 꺼 둔다 — 반투명 정렬이 매 프레임 흔들려 깜빡이는 걸 막는다
    const wantT = o < 0.995;
    if (spokeMat.transparent !== wantT) { spokeMat.transparent = wantT; spokeMat.needsUpdate = true; }
    spokeMat.visible = o > 0.02;
  }
  for (const w of wheels) {
    w.userData.roll.rotation.x = wheelRoll;
    if (w.userData.front) w.rotation.y = car.steer * 0.5;
  }
  brakeMats.forEach(m => m.emissiveIntensity += ((braking ? 2.4 : 0.35) - m.emissiveIntensity) * Math.min(1, dt * 12));

  updateChunks(car.x, car.z);
  updateRoad(car.z);
  scatter(car.x, car.z);
  scatterGrass(car.x, car.z);
  guardrails(car.z);
  roadUniforms.uWet.value = wMix.rain;
  // 계기판 40km/h 부터 걷기 시작해 95km/h 에서 완전히 사라진다
  detailU.value = 1 - smooth((Math.abs(car.speed) * 2.14 - 40) / 55);
  // 갓길이 이어질 땅 색을 지금 바이옴에 맞춘다 → 도로 메시와 지형 메시가 같은 색으로 만난다
  biomeColor(biomeAt(car.z), 'ground', roadUniforms.uGround.value);
  windU.uTime.value = elapsed * (1 + wMix.rain * 0.8);   // 비 오면 바람도 세진다

  // ── 시간 · 하늘 · 빛
  dayTime = (dayTime + dt * timeScale * 0.05) % 24;
  const ang = (dayTime / 24) * Math.PI * 2 - Math.PI / 2;
  sunDir.set(Math.cos(ang) * 0.35, Math.sin(ang), Math.cos(ang) * 0.92).normalize();
  const day = smooth(sunDir.y * 3.2 + 0.12);
  const dusk = Math.max(0, 1 - Math.abs(sunDir.y) * 5.5);
  const grey = 0.45 + 0.55 * wMix.light;      // 흐려도 너무 어두워지지 않게

  zenith.copy(DAY_ZEN).lerp(NIGHT_ZEN, 1 - day).lerp(GREY, (1 - grey) * 0.7 * day);
  horizon.copy(DAY_HOR).lerp(NIGHT_HOR, 1 - day)
    .lerp(DUSK_HOR, dusk * 0.75 * day).lerp(GREY, (1 - grey) * 0.7 * day);

  skyMat.uniforms.zenith.value.copy(zenith);
  skyMat.uniforms.horizon.value.copy(horizon);
  skyMat.uniforms.sunDir.value.copy(sunDir);
  skyMat.uniforms.dayAmt.value = day * (0.35 + 0.65 * grey);
  skyMat.uniforms.cloud.value = wMix.cloud;
  skyMat.uniforms.time.value = elapsed;

  // 하늘이 바뀌는 속도에 맞춰 환경맵을 다시 굽는다 (시간 배속이 크면 자주)
  const envEvery = timeScale >= 12 ? 0.9 : 2.5;
  if (elapsed - envAt > envEvery) { envAt = elapsed; updateEnv(); }

  const bl = biomeAt(car.z);
  biomeColor(bl, 'haze', fogCol);
  fogCol.lerp(NIGHT_HOR, 1 - day).lerp(DUSK_HOR, dusk * 0.55 * day).lerp(GREY, (1 - grey) * 0.6 * day);
  scene.fog.color.copy(fogCol);
  scene.fog.far = FOG_NEAR + (FOG_FAR - FOG_NEAR) * wMix.fogMul;
  renderer.setClearColor(fogCol);

  // 밤에는 달빛이 반대편에서 은은하게 든다
  sun.intensity = 2.9 * day * grey + 0.5 * (1 - day);
  sun.color.setRGB(1, 0.92 - dusk * 0.22, 0.84 - dusk * 0.42).lerp(_c1.setRGB(0.66, 0.76, 1), 1 - day);
  // ── 그림자 맵 텍셀 스냅 ────────────────────────────────────
  // 그림자 카메라가 차를 그냥 따라가면, 매 프레임 텍셀 크기보다 작게 움직이면서
  // 그림자 경계가 픽셀 단위로 계속 재계산된다 → 화면이 지지직 끓어 보인다.
  // 광원 좌표계에서 카메라 위치를 '텍셀 격자'에 딱 맞춰 반올림하면 멈춘다.
  _sdir.copy(sunDir).multiplyScalar(day > 0.05 ? 1 : -1);
  _sright.crossVectors(WORLD_UP, _sdir).normalize();
  _sup.crossVectors(_sdir, _sright).normalize();
  const texel = (2 * SH) / SHADOW_MAP;
  const px = Math.round(carRoot.position.dot(_sright) / texel) * texel;
  const py = Math.round(carRoot.position.dot(_sup) / texel) * texel;
  const pz = carRoot.position.dot(_sdir);
  _spos.copy(_sright).multiplyScalar(px)
       .addScaledVector(_sup, py)
       .addScaledVector(_sdir, pz);
  sun.target.position.copy(_spos);
  sun.position.copy(_spos).addScaledVector(_sdir, 340);
  hemi.intensity = 0.85 + 0.75 * day * grey;
  hemi.color.copy(horizon);
  // 땅에서 튄 빛 — 너무 어둡게 두면 그늘이 새까맣게 죽는다
  hemi.groundColor.copy(fogCol).lerp(WHITE, 0.15).multiplyScalar(0.62);
  // 채움광은 태양 반대쪽에서, 태양이 셀수록 약하게
  fill.position.copy(sunDir).multiplyScalar(-260).setY(180).add(carRoot.position);
  fill.target.position.copy(carRoot.position);
  fill.intensity = 0.22 + 0.30 * (1 - day) + 0.18 * (1 - grey);
  fill.color.copy(horizon).lerp(WHITE, 0.3);

  const autoOn = day < 0.42 || grey < 0.55;
  const wantHL = (lightsManual === null ? autoOn : lightsManual) ? 4.0 : 0;
  headlights.forEach(s => s.intensity += (wantHL - s.intensity) * Math.min(1, dt * 3));
  dashMats.forEach(m => m.emissiveIntensity += ((1 - day) * 1.4 + 0.15 - m.emissiveIntensity) * Math.min(1, dt * 2));

  // ── 바다
  const coast = coastFactor(car.z);
  water.visible = coast > 0.02;
  if (water.visible) {
    water.position.set(Math.round(car.x / 40) * 40, 0, Math.round(car.z / 40) * 40);
    waterMat.uniforms.time.value = elapsed;
    waterMat.uniforms.sunDir.value.copy(sunDir);
    waterMat.uniforms.sunCol.value.copy(sun.color).multiplyScalar(0.4 + day * 1.6 * grey);
    waterMat.uniforms.skyCol.value.copy(horizon).lerp(zenith, 0.35);
    waterMat.uniforms.fogColor.value.copy(fogCol);
    waterMat.uniforms.fogFar.value = scene.fog.far;
  }

  // ── 비 · 눈 ────────────────────────────────────────────────
  // 설원에서는 같은 강수가 눈으로 내린다. 두 개가 동시에 보이지 않게 서로 반대로 섞는다.
  const snowK = snowFactor(car.z);
  const rainAmt = wMix.rain * (1 - snowK);
  const snowAmt = snowK * (0.30 + 0.70 * wMix.rain);   // 설원이면 늘 조금, 비 오는 날엔 펑펑

  rain.material.opacity = rainAmt * 0.55;
  rain.visible = rainAmt > 0.01;
  if (rain.visible) {
    rain.position.set(car.x, car.y, car.z);
    // 차가 달리면 빗줄기가 뒤로 기운다 — 앞유리로 쏟아지는 그 느낌
    const tiltX = -Math.sin(car.heading) * car.speed * 0.010;
    const tiltZ = -Math.cos(car.heading) * car.speed * 0.010;
    for (let i = 0; i < RAIN_N; i++) {
      let y = rainDrop[i * 3 + 1] - dt * RAIN_SPD;
      if (y < 0) {
        y += 95;
        rainDrop[i * 3]     = (Math.random() - 0.5) * 200;
        rainDrop[i * 3 + 2] = (Math.random() - 0.5) * 200;
      }
      rainDrop[i * 3 + 1] = y;
      const x = rainDrop[i * 3], z = rainDrop[i * 3 + 2], o = i * 6;
      rainVert[o]     = x;                    rainVert[o + 1] = y;             rainVert[o + 2] = z;
      rainVert[o + 3] = x + tiltX * RAIN_LEN; rainVert[o + 4] = y - RAIN_LEN;  rainVert[o + 5] = z + tiltZ * RAIN_LEN;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  snow.material.opacity = snowAmt * 0.85;
  snow.visible = snowAmt > 0.01;
  if (snow.visible) {
    snow.position.set(car.x, car.y, car.z);
    const p = snowGeo.attributes.position;
    for (let i = 0; i < SNOW_N; i++) {
      let y = p.getY(i) - dt * (5.5 + (i % 7) * 0.5);          // 알갱이마다 낙하 속도가 다르다
      if (y < 0) { y += 70; p.setX(i, (Math.random() - 0.5) * 150); p.setZ(i, (Math.random() - 0.5) * 150); }
      // 좌우로 흩날린다 — 알갱이마다 위상을 달리해 한 덩어리로 움직이지 않게
      p.setX(i, p.getX(i) + Math.sin(elapsed * 0.9 + i * 0.7) * dt * 1.6);
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }

  // ── 카메라
  const sp = Math.abs(car.speed);
  interior.visible = false;          // 1인칭이 없어져 실내는 항상 숨긴다
  camera.up.set(0, 1, 0);

  if (camMode === 0) {
    // 차 바로 뒤·낮은 눈높이. 속도가 붙으면 아주 조금만 뒤로 밀린다.
    const back = 5.9 + Math.min(0.8, sp * 0.02) + (boost ? 0.5 : 0);   // 속도로 뒤로 밀리는 양을 줄였다
    const up   = 1.95 + Math.min(0.5, sp * 0.009);
    camPos.lerp(_pos.set(car.x - Math.sin(car.heading) * back, car.y + up,
      car.z - Math.cos(car.heading) * back), Math.min(1, dt * 4.2));
    camPos.y = Math.max(camPos.y, terrainHeight(camPos.x, camPos.z) + 1.15);
    // 차가 화면 하단 중앙에 오도록 시선을 살짝 위·멀리 둔다 → 도로가 멀리까지 뻗어 보인다
    camLook.lerp(_pos.set(car.x + Math.sin(car.heading) * 22, car.y + 1.75,
      car.z + Math.cos(car.heading) * 22), Math.min(1, dt * 3.4));
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  } else {
    const t = elapsed * 0.11;
    camPos.lerp(_pos.set(car.x + Math.sin(t) * 17, car.y + 4.5 + Math.sin(t * 2.3) * 1.6,
      car.z + Math.cos(t) * 17), Math.min(1, dt * 1.4));
    camPos.y = Math.max(camPos.y, terrainHeight(camPos.x, camPos.z) + 1.8);
    camera.position.copy(camPos);
    camera.lookAt(car.x, car.y + 1, car.z);
  }
  // 화각을 크게 벌리면 앞이 작아져 '화면이 뒤로 밀리는' 것처럼 보인다 → 부스트 감각용으로만 조금
  camera.fov = 55 + Math.min(4, sp * 0.06) * (boost ? 1.5 : 1);
  camera.updateProjectionMatrix();
  sky.position.copy(camera.position);

  // ── HUD
  if (hudOn) {
    speedEl.innerHTML = Math.round(sp * 2.14) + '<span>km/h</span>';   // 실제는 더 빠르지만 계기판은 100/120 기준
    const hh = Math.floor(dayTime), mm = Math.floor((dayTime % 1) * 60);
    const bname = bl.k < 0.5 ? bl.a.name : bl.b.name;
    // 필요한 것만: 주행 거리 · 지금 지나는 풍경 · 시각
    infoEl.innerHTML =
      `${(Math.abs(car.z) / 1000).toFixed(1)} km<i>·</i>${bname}<i>·</i>` +
      `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    if (toastT > 0 && (toastT -= dt) <= 0) toastEl.style.opacity = 0;
  }

  // 씬 → 렌더 타깃 → 후처리 → 화면
  if (postOn && sceneRT) {
    postMat.uniforms.uNear.value = camera.near;
    postMat.uniforms.uFar.value = camera.far;
    // 계기판 기준 90km/h 를 넘어서부터만 아주 옅게. 천천히 달릴 땐 완전히 선명하다.
    // (예전엔 sp*3.6 = 실제 168km/h 로 재서 순항만 해도 블러가 최대치로 걸렸고,
    //  그게 1인칭에서 화면이 뭉개져 안 보이던 원인이었다. 계기판과 같은 2.14 로 맞춘다.)
    const blurT = Math.max(0, (sp * 2.14 - 90) / 90);
    postMat.uniforms.uBlur.value = Math.min(0.028, blurT * 0.028);
    try {
      renderer.setRenderTarget(sceneRT);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCam);
    } catch (e) {                       // 후처리가 안 되는 환경이면 그냥 직접 그린다
      postOn = false;
      console.warn('후처리 비활성화', e);
      renderer.setRenderTarget(null);
    }
  }
  if (!postOn || !sceneRT) renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
