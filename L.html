<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>Smite Trainer</title>
<!--
  SMITE TRAINER — 정글러 강타(Smite) 연습 웹앱
  파일 하나로 동작한다. 더블클릭해서 브라우저로 열면 바로 실행된다. (외부 이미지·음원·라이브러리 없음)

  코드 구성 (아래 <script> 안의 구역)
    1. Config     : 몬스터·난이도·판정 기준·유틸
    2. Store      : 설정/기록 저장 (localStorage)
    3. Sound      : 효과음 (Web Audio 합성음, 음원 파일로 교체 가능)
    4. Timeline   : 몬스터 체력 감소 시뮬레이션
    5. AI         : 상대 정글러
    6. MonsterArt : 몬스터 SVG
    7. FX         : 피해 숫자·강타 이펙트·배너
    8. Game       : 라운드 진행·판정·결과
    9. Screens    : 메뉴·기록·설정 화면
   10. App        : 화면 전환·입력(SPACE / 터치)
-->
<style>
:root{
  --bg0:#030605;
  --panel:rgba(12,26,21,.78); --panel2:rgba(14,30,25,.96);
  --line:rgba(170,230,200,.14); --line2:rgba(170,230,200,.28);
  --text:#e9f2ec; --muted:#8ea69c; --dim:#5d7169;
  --gold:#f5c451; --gold2:#ffe39a; --gold-deep:#b9821c;
  --red:#ff4d5e; --green:#4be08f; --blue:#5aa8ff; --orange:#ff9d3d;
  --mon:#ff8a3d; --mon-glow:rgba(255,138,61,.45);
  --font:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg0);color:var(--text);font-family:var(--font);
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 80% 55% at 50% 32%,rgba(40,120,85,.30),transparent 70%),
    radial-gradient(ellipse 55% 40% at 12% 92%,rgba(20,80,65,.28),transparent 70%),
    radial-gradient(ellipse 55% 40% at 90% 88%,rgba(70,40,100,.20),transparent 70%),
    linear-gradient(180deg,#07120e 0%,#030605 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid currentColor;font:11px/1.4 var(--font);opacity:.7;margin-left:4px}

#app{height:100%}
.screen{display:none;height:100%;overflow-y:auto}
.screen.active{display:block;animation:fadeIn .25s}
#screen-game.active{overflow:hidden}

/* ---------- 메뉴 ---------- */
.menu-wrap{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;gap:18px}
.brand{text-align:center;margin-top:8px}
.brand-mark{
  width:72px;height:72px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 50% 35%,#fff4c9,var(--gold) 55%,var(--gold-deep));
  box-shadow:0 0 0 4px rgba(245,196,81,.2),0 0 40px rgba(245,196,81,.45);
}
.brand h1{font-size:34px;letter-spacing:5px;font-weight:900}
.brand h1 span{color:var(--gold)}
.tagline{color:var(--muted);font-size:14px;margin-top:4px;letter-spacing:1px}
.menu-status{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.menu-status span{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cfe0d8}
.menu-group{display:flex;flex-direction:column;gap:10px}
.menu-group h2,.page h3{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}
.mode-btn{
  display:flex;align-items:center;gap:14px;padding:16px;text-align:left;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);transition:transform .12s,border-color .12s,background .12s;
}
.mode-btn:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(20,42,34,.85)}
.mode-btn.featured{border-color:rgba(245,196,81,.45);background:linear-gradient(135deg,rgba(80,58,10,.45),rgba(12,26,21,.8))}
.mode-icon{font-size:28px;width:44px;text-align:center}
.mode-text{flex:1;display:flex;flex-direction:column;gap:3px}
.mode-text b{font-size:17px}
.mode-text small{font-size:12px;color:var(--muted)}
.mode-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--gold);color:#2a1a02}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.sub-btn:hover{border-color:var(--line2)}
.hint{text-align:center;font-size:12px;color:var(--dim)}
@media (hover:none){.hint,.smite-btn small,.result kbd{display:none}}

/* ---------- 기록 / 설정 페이지 ---------- */
.page{max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.page-head h2{font-size:22px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--line2)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{padding:14px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat-card span{font-size:12px;color:var(--muted)}
.stat-card b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-card small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.stat-card.hl{border-color:rgba(245,196,81,.4)} .stat-card.hl b{color:var(--gold)}
.page section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
.tbl tr+tr td{border-top:1px solid rgba(255,255,255,.04)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist li{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.hist .h-main{flex:1;color:#cfe0d8}
.hist .h-val{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:13px;padding:14px;text-align:center;background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
.danger-btn{align-self:flex-start;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,77,94,.4);color:var(--red);font-weight:700}
.danger-btn.armed{background:var(--red);color:#fff}

.set-block{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.set-block h3{margin:0}
.set-help{font-size:12px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:700;font-size:14px}
.chip-btn small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.chip-btn.on{background:var(--gold);color:#2a1a02;border-color:var(--gold)}
.chip-btn.on small{color:#5a4106}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;accent-color:var(--gold);height:28px}
.range-row output{min-width:64px;text-align:right;font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:#2a3833;position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{transform:translateX(22px)}

/* ---------- 게임 화면 ---------- */
.game{
  position:relative;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
}
.game-top{display:flex;align-items:center;gap:8px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chip.diff{margin-left:auto}
.chip.diff[data-diff="easy"]{color:var(--green)}
.chip.diff[data-diff="normal"]{color:var(--blue)}
.chip.diff[data-diff="hard"]{color:var(--red)}
.chip.streak{color:var(--orange)}

.enemy{
  margin-top:10px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;
  border:1px solid rgba(255,77,94,.25);background:linear-gradient(90deg,rgba(70,10,18,.55),rgba(20,10,12,.3));
  transition:background .2s,border-color .2s;
}
.enemy[hidden]{display:none}
.enemy-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#2a0b10;border:2px solid var(--red);flex:none}
.enemy-text{flex:1;display:flex;flex-direction:column;min-width:0}
.enemy-text b{font-size:13px;color:#ffb3ba}
.enemy-text span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enemy-smite{font-size:13px;font-weight:800;color:var(--red)}
.enemy.warn{border-color:var(--red);animation:warn .3s ease-in-out 3}
.enemy.warn .enemy-text span{color:#ffd0d4;font-weight:700}
.enemy.smite{background:rgba(255,77,94,.35);border-color:var(--red)}
.enemy.smite .enemy-text span{color:#fff}

.arena{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.monster-name{font-size:13px;letter-spacing:5px;color:var(--mon);font-weight:800;text-shadow:0 0 12px var(--mon-glow)}
.monster-wrap{position:relative;width:min(62vw,36vh,300px);aspect-ratio:240/220}
.monster-wrap::before{
  content:'';position:absolute;left:10%;right:10%;bottom:-4%;height:16%;border-radius:50%;
  background:radial-gradient(ellipse,var(--mon-glow),transparent 70%);filter:blur(4px);
}
.monster{width:100%;height:100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--mon-glow))}
.monster svg{width:100%;height:100%;display:block}
.monster-wrap.hit{animation:shake .16s}
.monster-wrap.hit-hard{animation:shakeHard .3s}
.monster-wrap.dead .monster{animation:dead .7s forwards}
.arena.quake{animation:quake .35s}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}

.hp-panel{padding:6px 2px 4px}
.hp-numbers{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.hp-cur{font-size:clamp(42px,12vw,66px);font-weight:900;line-height:1;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hp-max{font-size:18px;color:var(--muted)}
.hp-bar{position:relative;height:26px;margin-top:24px;border-radius:8px;background:#160b0b;border:1px solid rgba(255,255,255,.14)}
.hp-fill,.hp-lag{position:absolute;inset:2px;border-radius:6px;transform-origin:left center}
.hp-lag{background:#ffe1bf;opacity:.5;transition:transform .45s ease-out}
.hp-fill{background:linear-gradient(180deg,#ff6c55,#c42b1f 60%,#8c1a13);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hp-marker{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.hp-marker span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:11px;color:var(--gold);white-space:nowrap;font-weight:700}
.smite-info{text-align:center;margin-top:10px;color:var(--muted);font-size:14px}
.smite-info b{color:var(--gold);font-size:19px;margin-left:4px;font-variant-numeric:tabular-nums}

.smite-zone{display:flex;justify-content:center;padding:10px 0 4px}
.smite-btn{
  position:relative;width:clamp(132px,38vw,164px);aspect-ratio:1;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#2a1a02;
  background:radial-gradient(circle at 50% 32%,#fff6d2 0%,var(--gold2) 22%,var(--gold) 55%,var(--gold-deep) 100%);
  box-shadow:0 0 0 4px rgba(245,196,81,.25),0 0 36px rgba(245,196,81,.45),inset 0 -8px 16px rgba(120,70,0,.45);
  touch-action:manipulation;transition:transform .06s,filter .2s;
}
.smite-btn::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(245,196,81,.5);animation:ring 1.6s ease-out infinite;pointer-events:none}
.smite-btn:active{transform:scale(.94)}
.smite-btn.pressed{animation:press .18s ease-out}
.smite-btn.used{filter:grayscale(1) brightness(.5)}
.smite-btn.used::after{display:none}
.smite-glyph{font-size:38px;line-height:1}
.smite-label{font-size:24px;font-weight:900;letter-spacing:4px}
.smite-btn small{font-size:10px;letter-spacing:2px;opacity:.6}

/* ---------- 연출 ---------- */
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20;
  font-size:clamp(80px,26vw,150px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.4)}
.countdown.pop{animation:pop .6s ease-out forwards}
.countdown.go{color:var(--gold);text-shadow:0 0 40px rgba(245,196,81,.7);font-size:clamp(60px,18vw,110px);letter-spacing:6px}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:15;opacity:0;
  font-size:clamp(40px,12vw,72px);font-weight:900;letter-spacing:6px}
.banner.show{animation:banner 1s ease-out forwards}
.banner.good{color:var(--gold);text-shadow:0 0 30px rgba(245,196,81,.8)}
.banner.bad{color:var(--red);text-shadow:0 0 30px rgba(255,77,94,.7)}
.flash{position:absolute;inset:-20px;pointer-events:none;z-index:14;opacity:0}
.flash.gold{background:radial-gradient(circle at 50% 40%,rgba(255,226,140,.55),transparent 60%);animation:flash .4s ease-out}
.flash.red{background:radial-gradient(circle at 50% 40%,rgba(255,60,80,.45),transparent 60%);animation:flash .45s ease-out}
.flash.win{background:radial-gradient(circle at 50% 45%,rgba(255,220,120,.5),transparent 70%);animation:flash .8s ease-out}

.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;animation:floatUp .9s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.float-team{font-size:18px;color:#ffb4a6}
.float-big{font-size:28px;color:#ff7a66}
.float-smite{font-size:42px;color:var(--gold);text-shadow:0 0 18px rgba(245,196,81,.8),0 2px 6px #000;animation-duration:1.1s}
.float-enemy{font-size:38px;color:var(--red);text-shadow:0 0 16px rgba(255,77,94,.8),0 2px 6px #000;animation-duration:1.1s}
.float-note{font-size:16px;color:#fff}
.bolt{position:absolute;left:50%;top:-6%;width:34%;height:80%;transform:translateX(-50%);animation:bolt .45s ease-out forwards}
.bolt svg{width:100%;height:100%;display:block}
.bolt-me{color:#fff1b8;filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 24px var(--gold))}
.bolt-enemy{color:#ffc2c8;filter:drop-shadow(0 0 10px var(--red)) drop-shadow(0 0 24px var(--red))}

/* ---------- 결과 ---------- */
.result{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,5,.72);backdrop-filter:blur(3px)}
.result.show{display:flex;animation:fadeIn .25s}
.result-card{width:min(440px,100%);max-height:100%;overflow:auto;padding:22px 18px;border-radius:20px;text-align:center;
  background:var(--panel2);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:cardIn .35s cubic-bezier(.2,1.3,.4,1)}
.result-card.win{border-color:rgba(245,196,81,.6);box-shadow:0 0 50px rgba(245,196,81,.2),0 20px 60px rgba(0,0,0,.6)}
.result-card.lose{border-color:rgba(255,77,94,.5)}
.result-title{font-size:26px;font-weight:900;letter-spacing:2px}
.win .result-title{color:var(--gold)}
.lose .result-title{color:var(--red)}
.result-sub{color:var(--muted);font-size:13px;margin-top:4px}
.grade{display:inline-flex;flex-direction:column;align-items:center;margin-top:12px;padding:6px 18px;border-radius:12px;font-size:22px;font-weight:900;letter-spacing:3px;border:2px solid currentColor}
.grade small{font-size:11px;letter-spacing:1px;font-weight:600;opacity:.85}
.g-perfect{color:var(--gold)} .g-great{color:var(--green)} .g-good{color:var(--blue)}
.g-late,.g-close{color:var(--orange)} .g-fail{color:var(--red)}
.result-rows{margin:14px 0 4px;display:grid;gap:6px}
.result-rows div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px;text-align:left}
.result-rows dt{color:var(--muted)}
.result-rows dd{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.result-rows .gold dd{color:var(--gold)} .result-rows .good dd{color:var(--green)}
.result-rows .bad dd{color:var(--orange)} .result-rows .enemy dd{color:var(--red)}
.result-note{margin-top:10px;padding:8px 10px;border-radius:6px;border-left:3px solid var(--gold);background:rgba(245,196,81,.07);font-size:13px;line-height:1.55;color:#c8d8d1;text-align:left}
.result-streak{margin-top:10px;font-size:13px;color:var(--muted)}
.result-streak b{color:var(--orange)}
.result-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line2);font-weight:800}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a02;border:0}

/* ---------- 키프레임 ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.015)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-4px,1px)}75%{transform:translate(4px,-1px)}}
@keyframes shakeHard{0%,100%{transform:none}20%{transform:translate(-10px,3px) rotate(-2deg)}40%{transform:translate(9px,-3px) rotate(2deg)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-1px)}}
@keyframes dead{to{transform:translateY(12px) scale(.9);opacity:.25;filter:grayscale(1)}}
@keyframes quake{0%,100%{transform:none}25%{transform:translate(0,6px)}50%{transform:translate(0,-4px)}75%{transform:translate(0,2px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
@keyframes bolt{0%{opacity:0;transform:translateX(-50%) scaleY(.3)}15%{opacity:1;transform:translateX(-50%) scaleY(1)}100%{opacity:0;transform:translateX(-50%) scaleY(1)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes ring{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.18);opacity:0}}

@media (max-height:640px){
  .hp-cur{font-size:40px}
  .hp-bar{margin-top:20px}

}
@media (prefers-reduced-motion:reduce){
  .monster,.smite-btn::after{animation:none}
  .monster-wrap.hit,.monster-wrap.hit-hard,.arena.quake{animation:none}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 메인 메뉴 ===== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <header class="brand">
        <div class="brand-mark">⚡</div>
        <h1>SMITE <span>TRAINER</span></h1>
        <p class="tagline">정글러를 위한 강타 타이밍 연습</p>
      </header>

      <div class="menu-status" id="menu-status"></div>

      <div class="menu-group">
        <h2>강타 연습</h2>
        <button class="mode-btn featured" data-mode="fight">
          <span class="mode-icon">⚔️</span>
          <span class="mode-text"><b>강타 싸움 연습</b><small>상대 정글러보다 먼저, 정확하게 강타</small></span>
          <span class="mode-tag">핵심</span>
        </button>
        <button class="mode-btn" data-mode="accuracy">
          <span class="mode-icon">🎯</span>
          <span class="mode-text"><b>정확도 연습</b><small>상대 없이 체력만 보고 오차 줄이기</small></span>
        </button>
        <button class="mode-btn" data-mode="reaction">
          <span class="mode-icon">⚡</span>
          <span class="mode-text"><b>반응속도 연습</b><small>강타 가능 체력이 되는 순간 즉시</small></span>
        </button>
      </div>

      <div class="menu-row">
        <button class="sub-btn" data-go="stats"><span>📊</span>기록</button>
        <button class="sub-btn" data-go="settings"><span>⚙️</span>설정</button>
      </div>
      <p class="hint">PC: <kbd>SPACE</kbd> 강타 · <kbd>ESC</kbd> 메뉴</p>
    </div>
  </section>

  <!-- ===== 게임 ===== -->
  <section id="screen-game" class="screen">
    <div class="game">
      <div class="game-top">
        <button class="icon-btn" id="btn-quit" aria-label="메뉴로">✕</button>
        <span class="chip" id="mode-label">강타 싸움</span>
        <span class="chip streak" id="streak-chip">🔥 0</span>
        <span class="chip diff" id="diff-label">NORMAL</span>
      </div>

      <div class="enemy" id="enemy">
        <div class="enemy-avatar">🗡️</div>
        <div class="enemy-text"><b>상대 정글러</b><span id="enemy-status">대기 중</span></div>
        <div class="enemy-smite">⚡ <span id="enemy-dmg">900</span></div>
      </div>

      <div class="arena" id="arena">
        <div class="monster-name" id="monster-name">DRAGON</div>
        <div class="monster-wrap" id="monster-wrap"><div class="monster" id="monster"></div></div>
        <div class="fx-layer" id="fx-layer"></div>
      </div>

      <div class="hp-panel">
        <div class="hp-numbers"><span class="hp-cur" id="hp-cur">5,000</span><span class="hp-max">/ <span id="hp-max">5,000</span></span></div>
        <div class="hp-bar">
          <div class="hp-lag" id="hp-lag"></div>
          <div class="hp-fill" id="hp-fill"></div>
          <div class="hp-marker" id="hp-marker"><span>강타 <b id="marker-dmg">900</b></span></div>
        </div>
        <div class="smite-info">내 강타 피해량<b id="smite-dmg">900</b></div>
      </div>

      <div class="smite-zone">
        <button class="smite-btn" id="btn-smite" aria-label="강타">
          <span class="smite-glyph">⚡</span><span class="smite-label" id="smite-label">강타</span><small>SPACE</small>
        </button>
      </div>

      <div class="flash" id="flash"></div>
      <div class="countdown" id="countdown"></div>
      <div class="banner" id="banner"></div>
      <div class="result" id="result"></div>
    </div>
  </section>

  <!-- ===== 기록 ===== -->
  <section id="screen-stats" class="screen">
    <div class="page">
      <header class="page-head"><button class="icon-btn" data-go="menu" aria-label="뒤로">←</button><h2>내 기록</h2></header>
      <div id="stats-body"></div>
    </div>

  <!-- ===== 설정 ===== -->
  <section id="screen-settings" class="screen">
    <div class="page">
      <header class="page-head"><button class="icon-btn" data-go="menu" aria-label="뒤로">←</button><h2>설정</h2></header>
      <div id="settings-body"></div>
    </div>
  </section>

<script>
'use strict';
const S = {};

/* =====================================================================
   1. Config — 몬스터 · 난이도 · 판정 기준 · 유틸
   ===================================================================== */
S.MONSTERS = {
  dragon: { id: 'dragon', name: 'DRAGON', ko: '드래곤', maxHp: 5000, color: '#ff8a3d', icon: '🐉' },
  herald: { id: 'herald', name: 'HERALD', ko: '전령',   maxHp: 6000, color: '#3fd6c6', icon: '👁️' },
  baron:  { id: 'baron',  name: 'BARON',  ko: '남작',   maxHp: 8000, color: '#b77cff', icon: '🐍' },
};

// finalDps: 강타 구간 근처의 초당 피해 / burstGap: 스킬 한 방 간격(초) / burstRatio: 한 방 크기(강타 피해량 대비)
// combo: 연속 스킬(체력 급감) 확률. 한 방이 강타 피해량의 절반을 넘지 않게 해서 강타 구간을 통째로 건너뛰는 일은 없다.
S.DIFFICULTY = {
  easy:   { label: 'EASY',   ko: '쉬움',   finalDps: 380, burstGap: [0.9, 1.8],  burstRatio: [0.08, 0.22], combo: 0,
            desc: '체력이 천천히 줄고, 상대가 강타하기 직전에 신호를 보냅니다.' },
  normal: { label: 'NORMAL', ko: '보통',   finalDps: 500, burstGap: [0.7, 1.5],  burstRatio: [0.10, 0.30], combo: 0.1,
            desc: '상대의 강타 타이밍이 매번 달라지고, 신호가 없습니다.' },
  hard:   { label: 'HARD',   ko: '어려움', finalDps: 640, burstGap: [0.45, 1.1], burstRatio: [0.12, 0.40], combo: 0.25,
            desc: '체력이 빠르게 줄고, 상대가 빠른 강타·늦은 강타·페이크 등 여러 패턴을 씁니다.' },
};
S.SMITE = { presets: [600, 900, 1200], min: 400, max: 1600, step: 10 };
S.MODES = { fight: '강타 싸움', accuracy: '정확도 연습', reaction: '반응속도 연습' };

S.GRADES = {
  perfect: { label: 'PERFECT', ko: '완벽',      cls: 'g-perfect' },
  great:   { label: 'GREAT',   ko: '좋음',      cls: 'g-great' },
  good:    { label: 'GOOD',    ko: '괜찮음',    cls: 'g-good' },
  late:    { label: 'LATE',    ko: '너무 늦음', cls: 'g-late' },
  slow:    { label: 'SLOW',    ko: '느림',      cls: 'g-late' },
  close:   { label: 'ALMOST',  ko: '거의 성공', cls: 'g-close' },
  early:   { label: 'EARLY',   ko: '너무 빠름', cls: 'g-fail' },
  miss:    { label: 'MISS',    ko: '놓침',      cls: 'g-fail' },
};

// 강타 순간 체력(정수)으로 판정. 오차 = |체력 - 피해량|
S.judgeHp = function (hp, dmg) {
  const error = Math.abs(hp - dmg);
  if (hp > dmg) return { kill: false, error, grade: error <= dmg * 0.03 ? 'close' : 'early' };
  const r = error / dmg;
  return { kill: true, error, grade: r <= 0.03 ? 'perfect' : r <= 0.09 ? 'great' : r <= 0.2 ? 'good' : 'late' };
};
S.judgeReaction = sec => sec <= 0.2 ? 'perfect' : sec <= 0.28 ? 'great' : sec <= 0.4 ? 'good' : 'slow';

S.rand  = (a, b) => a + Math.random() * (b - a);
S.pick  = arr => arr[Math.floor(Math.random() * arr.length)];
S.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
S.fmt   = n => Math.max(0, Math.round(n)).toLocaleString('en-US');
S.sec   = s => s.toFixed(3) + '초';

/* =====================================================================
   2. Store — 설정 / 기록 저장 (localStorage, 막혀 있어도 앱은 동작)
   ===================================================================== */
S.Store = (function () {
  const SETTINGS_KEY = 'smiteTrainer.settings.v1';
  const STATS_KEY = 'smiteTrainer.stats.v1';
  const DEFAULTS = { smiteDamage: 900, difficulty: 'normal', monster: 'dragon', sound: true };

  function read(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
  function emptyStats() {
    return {
      total: 0, success: 0, fail: 0, steals: 0, perfect: 0,
      reactionSum: 0, reactionCount: 0, bestReaction: null,
      errorSum: 0, errorCount: 0, bestError: null,
      streak: 0, bestStreak: 0,
      modes: {}, monsters: {}, history: [],
    };
  }
  function bucket(map, key) {
    return map[key] || (map[key] = { played: 0, success: 0, errorSum: 0, errorCount: 0, bestError: null });
  }
  const minOr = (cur, v) => cur == null ? v : Math.min(cur, v);

  const settings = Object.assign({}, DEFAULTS, read(SETTINGS_KEY) || {});
  if (!S.DIFFICULTY[settings.difficulty]) settings.difficulty = DEFAULTS.difficulty;
  if (settings.monster !== 'random' && !S.MONSTERS[settings.monster]) settings.monster = DEFAULTS.monster;
  settings.smiteDamage = S.clamp(Math.round(+settings.smiteDamage || DEFAULTS.smiteDamage), S.SMITE.min, S.SMITE.max);

  let stats = Object.assign(emptyStats(), read(STATS_KEY) || {});

  return {
    settings,
    get stats() { return stats; },
    saveSettings() { write(SETTINGS_KEY, settings); },
    // r = { mode, monster, difficulty, success, steal, grade, error, reaction }
    record(r) {
      stats.total++;
      if (r.success) { stats.success++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak); }
      else { stats.fail++; stats.streak = 0; }
      if (r.steal) stats.steals++;
      if (r.grade === 'perfect') stats.perfect++;
      if (r.reaction != null) { stats.reactionSum += r.reaction; stats.reactionCount++; stats.bestReaction = minOr(stats.bestReaction, r.reaction); }
      if (r.error != null) { stats.errorSum += r.error; stats.errorCount++; stats.bestError = minOr(stats.bestError, r.error); }
      for (const b of [bucket(stats.modes, r.mode), bucket(stats.monsters, r.monster)]) {
        b.played++;
        if (r.success) b.success++;
        if (r.error != null) { b.errorSum += r.error; b.errorCount++; b.bestError = minOr(b.bestError, r.error); }
      }
      stats.history.unshift({ mode: r.mode, monster: r.monster, difficulty: r.difficulty, success: r.success,
                              grade: r.grade, error: r.error, reaction: r.reaction, at: Date.now() });
      if (stats.history.length > 30) stats.history.length = 30;
      write(STATS_KEY, stats);
    },
    reset() { stats = emptyStats(); write(STATS_KEY, stats); },
  };
})();

/* =====================================================================
   3. Sound — Web Audio 합성음. FILES에 경로를 넣으면 음원 파일을 우선 사용.
   ===================================================================== */
S.Sound = (function () {
  // 예: smite: 'sounds/smite.mp3'  (비워두면 합성음. 파일을 못 읽어도 합성음으로 대체)
  const FILES = { smite: '', enemySmite: '', kill: '', success: '', fail: '', count: '', go: '', hit: '', tell: '' };
  let ctx = null, noiseBuf = null;
  const cache = {};

  function audio() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(o) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g).connect(a.destination);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  }
  function noise(o) {
    const a = audio(); if (!a) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = a.currentTime + (o.delay || 0);
    const src = a.createBufferSource(); src.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 1500, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    const g = a.createGain();
    g.gain.setValueAtTime(o.vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f).connect(g).connect(a.destination);
    src.start(t); src.stop(t + o.dur + 0.05);
  }
  const SYNTH = {
    smite()      { noise({ freq: 3000, to: 400, dur: 0.3, vol: 0.5 }); tone({ freq: 1200, to: 90, dur: 0.28, type: 'sawtooth', vol: 0.14 }); },
    enemySmite() { noise({ freq: 1800, to: 300, dur: 0.3, vol: 0.4 }); tone({ freq: 500, to: 70, dur: 0.3, type: 'square', vol: 0.1 }); },
    kill()       { tone({ freq: 180, to: 45, dur: 0.6, type: 'triangle', vol: 0.35 }); noise({ freq: 400, to: 80, dur: 0.5, vol: 0.25, filter: 'lowpass' }); },
    success()    { [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.22, type: 'triangle', vol: 0.18, delay: 0.08 * i })); },
    fail()       { tone({ freq: 330, to: 220, dur: 0.25, type: 'square', vol: 0.09 }); tone({ freq: 220, to: 110, dur: 0.4, type: 'square', vol: 0.09, delay: 0.22 }); },
    count()      { tone({ freq: 660, dur: 0.1, type: 'square', vol: 0.08 }); },
    go()         { tone({ freq: 990, dur: 0.25, type: 'square', vol: 0.1 }); },
    hit()        { noise({ freq: 900, dur: 0.07, vol: 0.12 }); },
    tell()       { tone({ freq: 700, to: 1400, dur: 0.18, vol: 0.08 }); },
  };
  function synth(name) { try { if (SYNTH[name]) SYNTH[name](); } catch (e) { /* 오디오 불가 환경 */ } }

  function play(name) {
    if (!S.Store.settings.sound) return;
    const file = FILES[name];
    if (file) {
      try {
        const a = cache[name] || (cache[name] = new Audio(file));
        a.currentTime = 0;
        a.play().catch(() => synth(name));
        return;
      } catch (e) { /* 합성음으로 */ }
    }
    synth(name);
  }
  return { play, unlock: audio, FILES };
})();

/* =====================================================================
   4. Timeline — 몬스터 체력 감소를 라운드 시작 전에 미리 만들어 둔다.
      hpAt(t)로 어느 순간이든 정확한 체력을 계산할 수 있어서,
      키를 누른 "그 순간"의 체력으로 판정한다(프레임 단위 오차 없음).
   ===================================================================== */
S.Timeline = class {
  constructor(startHp) { this.startHp = startHp; this.segs = []; this.bursts = []; this.end = 0; }
  addSeg(t0, t1, rate) { this.segs.push({ t0, t1, rate }); }
  addBurst(t, amt, kind) {
    let i = this.bursts.length;
    while (i > 0 && this.bursts[i - 1].t > t) i--;
    this.bursts.splice(i, 0, { t, amt, kind: kind || 'hit' });
  }
  damageAt(t) {
    let d = 0;
    for (const s of this.segs) { if (t <= s.t0) break; d += (Math.min(t, s.t1) - s.t0) * s.rate; }
    for (const b of this.bursts) { if (b.t > t) break; d += b.amt; }
    return d;
  }
  hpAt(t) { return Math.max(0, this.startHp - this.damageAt(t)); }
  // 체력이 처음으로 v 이하가 되는 시점. 체력은 줄기만 하므로 이분 탐색.
  timeAtMost(v) {
    if (this.hpAt(0) <= v) return 0;
    let lo = 0, hi = this.end;
    if (this.hpAt(hi) > v) return Infinity;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (this.hpAt(mid) <= v) hi = mid; else lo = mid;
    }
    return hi;
  }

  // 강타 싸움·정확도용: 구간마다 초당 피해가 조금씩 달라지고, 가끔 스킬 한 방이 들어온다.
  static drain({ startHp, dmg, diff }) {
    const P = S.DIFFICULTY[diff];
    const tl = new S.Timeline(startHp);
    const fastDps = Math.max(P.finalDps, startHp / 4.5);
    let t = 0, hp = startHp;
    let next = S.rand(P.burstGap[0], P.burstGap[1]) * 0.6;
    // 몬스터가 죽은 뒤에도 조금 더 만들어 둔다 (늦게 누른 강타가 몇 HP였을지 비교용)
    while (hp > -dmg * 1.5) {
      const dur = S.rand(0.35, 0.9);
      // 체력이 많을 땐 빨리 깎아 기다림을 줄이고, 강타 구간에 가까워질수록 난이도 속도로 수렴
      const k = S.clamp((hp - dmg * 1.8) / Math.max(1, startHp - dmg * 1.8), 0, 1);
      const rate = (P.finalDps + k * (fastDps - P.finalDps)) * S.rand(0.8, 1.2);
      tl.addSeg(t, t + dur, rate);
      while (next < t + dur) {
        const amt = dmg * S.rand(P.burstRatio[0], P.burstRatio[1]);
        tl.addBurst(next, amt); hp -= amt;
        if (Math.random() < P.combo) {
          const a2 = dmg * S.rand(0.06, 0.14);
          tl.addBurst(next + 0.12, a2); hp -= a2;
        }
        next += S.rand(P.burstGap[0], P.burstGap[1]);
      }
      hp -= rate * dur; t += dur;
    }
    tl.end = t;
    return tl;
  }

  // 반응속도용: 체력이 잘게 흔들리며 강타 피해량 바로 위에서 버티다가,
  // 예측할 수 없는 순간 한 방에 강타 가능 체력으로 떨어지고 이후 빠르게 녹는다.
  static reaction({ dmg, diff }) {
    const start = Math.round(dmg + S.rand(500, 1000));
    const dropAt = S.rand(1.6, 4.6);
    const floor = dmg + (diff === 'hard' ? S.rand(15, 60) : diff === 'normal' ? S.rand(40, 120) : S.rand(90, 200));
    const tl = new S.Timeline(start);
    let t = 0.15, hp = start;
    while (t < dropAt - 0.1) {
      const amt = (hp - floor) * S.rand(0.12, 0.32) + S.rand(0, 3);
      const real = Math.min(hp - floor, amt);
      if (real > 0.5) { tl.addBurst(t, real, 'tick'); hp -= real; }
      t += S.rand(0.09, 0.22);
    }
    const land = dmg - S.rand(5, 50);
    tl.addBurst(dropAt, hp - land, 'big');
    const rate = { easy: 450, normal: 600, hard: 760 }[diff];
    tl.addSeg(dropAt, dropAt + 10, rate);
    tl.end = dropAt + 10;
    tl.dropAt = dropAt;
    return tl;
  }
};

/* =====================================================================
   5. AI — 상대 정글러
      "체력이 target 이하가 되는 걸 보고, delay초 뒤에 누른다"로 행동을 표현한다.
      플레이어에게는 target/delay가 보이지 않는다.
   ===================================================================== */
S.AI = (function () {
  const PATTERN_LABEL = {
    steady: '늦은 강타 (예고 신호 있음)',
    random: '랜덤 타이밍',
    early:  '빠른 강타',
    late:   '늦은 강타',
    wait:   '끝까지 기다리기',
    fake:   '페이크',
    burst:  '체력 급감 순간 즉시 강타',
  };

  function makePlan(dmg, diff) {
    if (diff === 'easy')   return { pattern: 'steady', target: dmg - S.rand(160, 320), delay: S.rand(0.26, 0.4), tell: true };
    if (diff === 'normal') return { pattern: 'random', target: dmg - S.rand(30, 260), delay: S.rand(0.14, 0.3) };
    const pattern = S.pick(['early', 'late', 'wait', 'fake', 'burst']);
    switch (pattern) {
      case 'early': return { pattern, target: dmg - S.rand(5, 50), delay: S.rand(0.08, 0.16) };
      case 'late':  return { pattern, target: dmg - S.rand(180, 320), delay: S.rand(0.1, 0.2) };
      case 'wait':  return { pattern, target: Math.min(dmg * 0.25, S.rand(90, 200)), delay: S.rand(0.03, 0.07) };
      case 'fake': {
        // 강타 가능 체력보다 한참 위에서 "강타를 노린다" 신호만 보내 성급한 강타를 유도.
        const fakeHp = dmg + S.rand(120, 420);
        return Math.random() < 0.35
          ? { pattern, fakeHp, target: null }                                          // 끝내 강타 안 함
          : { pattern, fakeHp, target: dmg - S.rand(40, 200), delay: S.rand(0.1, 0.22) };
      }
      default: return { pattern: 'burst', target: dmg, delay: S.rand(0.07, 0.13) };
    }
  }

  // now: 다시 계산하는 시점 (플레이어의 강타가 빗나가 체력이 바뀌었을 때 등)
  function schedule(ai, tl, now) {
    const deathAt = tl.timeAtMost(0);
    if (ai.target == null) {
      ai.smiteAt = null;
    } else if (!(ai.smiteAt != null && ai.committedAt <= now)) {
      // 아직 목표 체력을 보지 못했다면, 바뀐 체력 기준으로 다시 계산
      const seen = Math.max(now, tl.timeAtMost(ai.target));
      ai.committedAt = seen;
      ai.smiteAt = seen + ai.delay;
    }
    if (ai.smiteAt != null && ai.smiteAt >= deathAt) ai.smiteAt = null; // 누르기 전에 체력이 0 → AI도 놓침
    ai.smiteHp = ai.smiteAt != null ? Math.ceil(tl.hpAt(ai.smiteAt)) : null;

    const tells = [];
    if (ai.tell && ai.smiteAt != null) tells.push({ t: Math.max(0, ai.smiteAt - 0.6) });
    if (ai.fakeHp) tells.push({ t: tl.timeAtMost(ai.fakeHp) });
    ai.tells = tells.filter(x => x.t >= now).sort((a, b) => a.t - b.t);
  }

  function create(dmg, diff, tl) {
    const ai = makePlan(dmg, diff);
    ai.smiteAt = null; ai.committedAt = Infinity;
    schedule(ai, tl, 0);
    return ai;
  }
  return { create, schedule, PATTERN_LABEL };
})();

/* =====================================================================
   7. FX — 피해 숫자 · 강타 번개 · 화면 플래시 · 배너
      transform/opacity 애니메이션만 쓰고, 동시에 떠 있는 요소 수를 제한한다.
   ===================================================================== */
S.FX = (function () {
  const BOLT = '<svg viewBox="0 0 100 200" preserveAspectRatio="none"><path d="M60 0 L28 94 L52 94 L22 200 L80 74 L54 74 L78 0 Z" fill="currentColor"/></svg>';
  let layer, wrap, flashEl, bannerEl;

  function init() {
    layer = document.getElementById('fx-layer');
    wrap = document.getElementById('monster-wrap');
    flashEl = document.getElementById('flash');
    bannerEl = document.getElementById('banner');
  }
  function restart(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function add(node) {
    if (layer.childElementCount > 14) layer.firstElementChild.remove();
    node.addEventListener('animationend', () => node.remove());
    layer.appendChild(node);
  }
  function float(text, cls) {
    const d = document.createElement('div');
    d.className = 'float ' + cls;
    d.textContent = text;
    d.style.left = (50 + S.rand(-16, 16)) + '%';
    d.style.top = (44 + S.rand(-10, 8)) + '%';
    add(d);
  }
  function flash(cls) { flashEl.className = 'flash'; void flashEl.offsetWidth; flashEl.className = 'flash ' + cls; }

  return {
    init,
    float,
    flash,
    hit(amount, big) { float('-' + S.fmt(amount), big ? 'float-big' : 'float-team'); restart(wrap, 'hit'); },
    smite(who, amount) {
      const b = document.createElement('div');
      b.className = 'bolt ' + (who === 'me' ? 'bolt-me' : 'bolt-enemy');
      b.innerHTML = BOLT;
      add(b);
      float('-' + S.fmt(amount), who === 'me' ? 'float-smite' : 'float-enemy');
      restart(wrap, 'hit-hard');
      flash(who === 'me' ? 'gold' : 'red');
    },
    banner(text, cls) { bannerEl.className = 'banner'; bannerEl.textContent = text; void bannerEl.offsetWidth; bannerEl.className = 'banner show ' + cls; },
    clear() { layer.innerHTML = ''; bannerEl.className = 'banner'; flashEl.className = 'flash'; },
  };
})();

/* =====================================================================
   8. Game — 라운드 진행 · 판정 · 결과
      상태: countdown → live → (resolving) → done
   ===================================================================== */
S.Game = (function () {
  const el = {};
  let R = null, raf = 0, timers = [], lastMode = 'fight', resultAt = 0;

  function init() {
    ['hp-cur', 'hp-max', 'hp-fill', 'hp-lag', 'hp-marker', 'marker-dmg', 'smite-dmg', 'monster', 'monster-name',
     'monster-wrap', 'btn-smite', 'smite-label', 'countdown', 'result', 'mode-label', 'diff-label', 'streak-chip',
     'enemy', 'enemy-status', 'enemy-dmg', 'screen-game', 'arena']
      .forEach(id => { el[id] = document.getElementById(id); });
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function restart(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function gt(ms) { return (ms - R.t0) / 1000; }
  function hexToRgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

  function start(mode) {
    stop();
    lastMode = mode;
    const st = S.Store.settings, dmg = st.smiteDamage, diff = st.difficulty;
    const mon = S.MONSTERS[st.monster === 'random' ? S.pick(Object.keys(S.MONSTERS)) : st.monster];
    let tl;
    if (mode === 'reaction') tl = S.Timeline.reaction({ dmg, diff });
    else if (mode === 'accuracy') tl = S.Timeline.drain({ startHp: Math.min(mon.maxHp, Math.round(dmg * S.rand(2.6, 3.4))), dmg, diff });
    else tl = S.Timeline.drain({ startHp: mon.maxHp, dmg, diff });

    R = {
      mode, mon, dmg, diff, tl,
      state: 'countdown', t0: 0, burstIdx: 0, tellIdx: 0,
      enterAt: mode === 'reaction' ? tl.dropAt : tl.timeAtMost(dmg),   // 강타 가능 구간 진입 시각
      deathAt: tl.timeAtMost(0),
      ai: mode === 'fight' ? S.AI.create(dmg, diff, tl) : null,
      me: null, late: null, endT: null, finalHp: null, shownHp: -1,
    };
    setupView();
    S.App.show('game');
    countdown();
  }

  function setupView() {
    const { mon, dmg, mode, diff } = R;
    el['screen-game'].style.setProperty('--mon', mon.color);
    el['screen-game'].style.setProperty('--mon-glow', hexToRgba(mon.color, 0.45));
    el.monster.innerHTML = S.MonsterArt[mon.id];
    el['monster-wrap'].className = 'monster-wrap';
    el['monster-name'].textContent = mon.name + ' · ' + mon.ko;
    el['hp-max'].textContent = S.fmt(mon.maxHp);
    el['hp-marker'].style.left = (dmg / mon.maxHp * 100) + '%';
    el['marker-dmg'].textContent = dmg;
    el['smite-dmg'].textContent = S.fmt(dmg);
    el['mode-label'].textContent = S.MODES[mode];
    el['diff-label'].textContent = S.DIFFICULTY[diff].label;
    el['diff-label'].dataset.diff = diff;
    el['streak-chip'].textContent = '🔥 ' + S.Store.stats.streak;
    el.enemy.hidden = mode !== 'fight';
    el['enemy-dmg'].textContent = dmg;
    setEnemy('에픽 몬스터 근처에서 대기 중', '');
    el['btn-smite'].className = 'smite-btn';
    el['smite-label'].textContent = '강타';
    el.result.className = 'result';
    el.result.innerHTML = '';
    el.countdown.className = 'countdown';
    el.countdown.textContent = '';
    S.FX.clear();
    el['hp-lag'].style.transition = 'none';
    render(0);
    void el['hp-lag'].offsetWidth;
    el['hp-lag'].style.transition = '';
  }

  function setEnemy(text, cls) {
    el['enemy-status'].textContent = text;
    el.enemy.className = 'enemy' + (cls ? ' ' + cls : '');
  }

  function countdown() {
    const steps = ['3', '2', '1', 'START'];
    const gap = R.mode === 'fight' ? 650 : 520;
    steps.forEach((s, i) => later(() => {
      el.countdown.textContent = s;
      el.countdown.className = 'countdown' + (s === 'START' ? ' go' : '');
      restart(el.countdown, 'pop');
      S.Sound.play(s === 'START' ? 'go' : 'count');
      if (s === 'START') {
        R.state = 'live';
        R.t0 = performance.now();
        if (R.ai) setEnemy('타이밍을 재는 중…', '');
        raf = requestAnimationFrame(frame);
      }
    }, i * gap));
  }

  function render(t) {
    const hp = R.finalHp != null ? R.finalHp : Math.ceil(R.tl.hpAt(t));
    if (hp === R.shownHp) return;
    R.shownHp = hp;
    el['hp-cur'].textContent = S.fmt(hp);
    const k = 'scaleX(' + S.clamp(hp / R.mon.maxHp, 0, 1) + ')';
    el['hp-fill'].style.transform = k;
    el['hp-lag'].style.transform = k;
  }

  function frame(now) {
    if (!R || R.state !== 'live') return;
    const t = gt(now);
    advance(t);
    if (R && R.state === 'live') {
      render(t);
      raf = requestAnimationFrame(frame);
    }
  }

  // 시각 t까지 일어난 일(스킬 피해 표시, 상대 신호, 상대 강타, 체력 0)을 순서대로 처리
  function advance(t) {
    const tl = R.tl;
    while (R.burstIdx < tl.bursts.length && tl.bursts[R.burstIdx].t <= t) {
      const b = tl.bursts[R.burstIdx++];
      if (b.t <= R.deathAt && (b.kind === 'hit' || b.kind === 'big')) {
        S.FX.hit(b.amt, b.kind === 'big');
        S.Sound.play('hit');
      }
    }
    const ai = R.ai;
    if (ai) {
      while (R.tellIdx < ai.tells.length && ai.tells[R.tellIdx].t <= t) { R.tellIdx++; enemyTell(); }
      if (ai.smiteAt != null && t >= ai.smiteAt) return aiKill();
    }
    if (t >= R.deathAt) return teamKill();
  }

  function enemyTell() {
    setEnemy('⚠ 강타를 노린다!', 'warn');
    S.Sound.play('tell');
    later(() => { if (R && R.state === 'live') setEnemy('타이밍을 재는 중…', ''); }, 900);
  }

  function pressVisual() { restart(el['btn-smite'], 'pressed'); }

  // ts: 입력 이벤트의 타임스탬프(performance.now 기준)
  function smite(ts) {
    if (!R) return;
    if (R.state === 'countdown') { S.FX.float('아직!', 'float-note'); return; }
    const t = gt(ts);

    if (R.state === 'live') {
      advance(t);                           // 누르기 전에 벌어진 일을 먼저 처리 → 공정한 판정
      if (R.state !== 'live') return smite(ts);
      if (R.me) return;                     // 강타는 한 번뿐
      const hp = Math.ceil(R.tl.hpAt(t));
      const j = S.judgeHp(hp, R.dmg);
      R.me = { t, hp, j, reaction: t >= R.enterAt ? t - R.enterAt : null };
      pressVisual();
      S.Sound.play('smite');
      S.FX.smite('me', R.dmg);
      if (j.kill) return finish('me');

      if (R.mode === 'fight') {
        // 피해량 부족: 강타는 날아가고 몬스터만 깎인다. 상대는 계속 노린다.
        R.tl.addBurst(t, R.dmg, 'smite');
        R.burstIdx++;
        R.enterAt = R.tl.timeAtMost(R.dmg);
        R.deathAt = R.tl.timeAtMost(0);
        S.AI.schedule(R.ai, R.tl, t);
        R.tellIdx = 0;
        el['btn-smite'].classList.add('used');
        el['smite-label'].textContent = '사용됨';
        S.FX.float('피해량 부족!', 'float-note');
        setEnemy('기회를 잡았다…', '');
        return;
      }
      return finish('early');
    }

    if (R.state === 'resolving' && !R.me && !R.late) {
      // 상대/팀이 먼저 처치한 뒤 누른 강타 → 얼마나 늦었는지 기록
      R.late = { t, hp: Math.ceil(R.tl.hpAt(t)), sec: t - R.endT };
      pressVisual();
      S.Sound.play('smite');
    }
  }

  function killMonster() {
    R.finalHp = 0;
    render(0);
    el['monster-wrap'].classList.add('dead');
  }

  function aiKill() {
    R.state = 'resolving';
    R.endT = R.ai.smiteAt;
    killMonster();
    S.Sound.play('enemySmite');
    S.FX.smite('enemy', R.dmg);
    setEnemy('강타 성공 — 몬스터를 가져갔다', 'smite');
    S.FX.banner('STOLEN', 'bad');
    later(() => finish('ai'), 850);
  }

  function teamKill() {
    R.state = 'resolving';
    R.endT = R.deathAt;
    killMonster();
    S.Sound.play('kill');
    S.FX.banner('MISSED', 'bad');
    later(() => finish('team'), 850);
  }

  function finish(outcome) {
    if (!R || R.state === 'done') return;
    R.state = 'done';
    cancelAnimationFrame(raf);
    let delay = 0;
    if (outcome === 'me') {
      R.endT = R.me.t;
      killMonster();
      S.Sound.play('kill');
      S.FX.banner('SMITE!', 'good');
      restart(el.arena, 'quake');
      later(() => S.FX.flash('win'), 150);
      delay = 800;
    } else if (outcome === 'early') {
      R.endT = R.me.t;
      R.finalHp = Math.max(0, R.me.hp - R.dmg);
      render(0);
      S.FX.banner(R.mode === 'reaction' ? 'FALSE START' : 'TOO EARLY', 'bad');
      delay = 800;
    }
    const out = buildResult(outcome);
    S.Store.record(out.stat);
    later(() => showResult(out), delay);
  }

  const hpTxt = n => S.fmt(n) + ' HP';
  const row = (k, v, cls) => ({ k, v, cls: cls || '' });

  function buildResult(outcome) {
    const { mode, dmg, me, ai, late } = R;
    const out = { title: '', sub: '', cls: 'lose', grade: null, rows: [], note: '' };
    const stat = { mode, monster: R.mon.id, difficulty: R.diff, success: false, steal: false, grade: null, error: null, reaction: null };
    if (me) { stat.error = me.j.error; stat.reaction = me.reaction; }

    if (mode === 'fight') {
      const pattern = '상대 패턴: <b>' + S.AI.PATTERN_LABEL[ai.pattern] + '</b>';
      if (outcome === 'me') {
        stat.success = true;
        stat.steal = ai.smiteAt != null;
        stat.grade = out.grade = me.j.grade;
        out.cls = 'win';
        out.title = '🏆 SMITE SUCCESS';
        out.sub = '강타 싸움에서 이겼습니다!';
        out.rows.push(row('강타 사용 체력', hpTxt(me.hp), 'gold'));
        out.rows.push(row('상대 강타', ai.smiteAt != null ? hpTxt(ai.smiteHp) + ' (예정)' : '사용 안 함', 'enemy'));
        out.rows.push(row('강타 오차', hpTxt(me.j.error)));
        if (me.reaction != null) out.rows.push(row('강타 가능 후 반응', S.sec(me.reaction)));
        if (ai.smiteAt != null) out.rows.push(row('상대보다', S.sec(ai.smiteAt - me.t) + ' 빠름', 'good'));
        out.note = pattern;
      } else {
        const mine = me ? me.hp : late ? late.hp : null;
        stat.grade = out.grade = me ? me.j.grade : 'miss';
        out.title = outcome === 'ai' ? '❌ SMITE FAILED' : '💀 NO SMITE';
        out.sub = outcome === 'ai' ? '상대 정글러가 강타로 가져갔습니다' : '강타 없이 몬스터가 쓰러졌습니다';
        out.rows.push(row('내 강타',
          me ? `${hpTxt(me.hp)} · 피해량 ${S.fmt(me.hp - dmg)} 부족`
             : late ? `${hpTxt(late.hp)} · ${S.sec(late.sec)} 늦음` : '누르지 않음', 'bad'));
        if (outcome === 'ai') out.rows.push(row('상대 강타', hpTxt(ai.smiteHp), 'enemy'));
        else out.rows.push(row('상대 강타', ai.fakeHp ? '페이크 (사용 안 함)' : '사용 안 함'));
        if (outcome === 'ai' && mine != null) out.rows.push(row('차이', hpTxt(Math.abs(mine - ai.smiteHp))));
        if (outcome === 'ai' && !me) out.rows.push(row('상대 반응', `강타 가능 후 ${S.sec(ai.smiteAt - R.enterAt)}`));

        let tip;
        if (me) tip = `체력이 ${S.fmt(me.hp)}일 때 눌러 피해량(${dmg})이 부족했어요. 숫자가 ${dmg} 이하로 내려온 걸 확인하고 누르세요.`;
        else if (late) tip = `상대보다 ${S.sec(late.sec)} 늦었어요. 체력이 ${dmg}에 가까워지면 미리 누를 준비를 하세요.`;
        else if (outcome === 'ai') tip = `상대는 체력이 ${dmg} 이하가 된 뒤 ${S.sec(ai.smiteAt - R.enterAt)} 만에 강타했어요.`;
        else tip = '체력이 0이 될 때까지 강타를 누르지 않았어요.';
        out.note = tip + '<br>' + pattern;
      }
    } else if (mode === 'accuracy') {
      out.rows.push(row('강타 피해량', S.fmt(dmg)));
      if (outcome === 'me') {
        const g = me.j.grade;
        stat.grade = out.grade = g;
        stat.success = g !== 'late';
        out.cls = stat.success ? 'win' : 'lose';
        out.title = stat.success ? '🎯 SMITE SUCCESS' : '⌛ 너무 늦음';
        out.sub = stat.success ? '정확하게 강타했습니다' : '처치는 했지만, 상대가 있었다면 빼앗겼을 거예요';
        out.rows.push(row('강타 사용 체력', hpTxt(me.hp)));
        out.rows.push(row('강타 오차', hpTxt(me.j.error), 'gold'));
        if (me.reaction != null) out.rows.push(row('강타 가능 후 반응', S.sec(me.reaction)));
      } else if (outcome === 'early') {
        const g = me.j.grade;
        stat.grade = out.grade = g;
        out.title = g === 'close' ? '😬 거의 성공!' : '❌ 너무 빠름';
        out.sub = `체력이 강타 피해량보다 ${S.fmt(me.hp - dmg)} 높았습니다`;
        out.rows.push(row('강타 사용 체력', hpTxt(me.hp)));
        out.rows.push(row('강타 오차', hpTxt(me.j.error), 'bad'));
      } else {
        stat.grade = out.grade = 'miss';
        out.title = '💀 MISS';
        out.sub = '체력이 0이 될 때까지 강타하지 않았습니다';
        if (late) out.rows.push(row('내 강타', `${S.sec(late.sec)} 늦음`, 'bad'));
      }
      out.note = `PERFECT 기준: 오차 ${Math.round(dmg * 0.03)} HP 이하 · GREAT ${Math.round(dmg * 0.09)} HP · GOOD ${Math.round(dmg * 0.2)} HP`;
    } else {
      if (outcome === 'me') {
        const rg = S.judgeReaction(me.reaction);
        stat.grade = out.grade = rg;
        stat.success = rg !== 'slow';
        out.cls = stat.success ? 'win' : 'lose';
        out.title = stat.success ? '⚡ SMITE SUCCESS' : '🐢 너무 느림';
        out.sub = '강타 가능 체력이 된 순간부터 누르기까지';
        out.rows.push(row('반응속도', S.sec(me.reaction), 'gold'));
        out.rows.push(row('강타 오차', hpTxt(me.j.error)));
        out.rows.push(row('판정', S.GRADES[rg].label));
      } else if (outcome === 'early') {
        stat.error = null;
        stat.grade = out.grade = 'early';
        out.title = '🚫 FALSE START';
        out.sub = '강타 가능 체력이 되기 전에 눌렀습니다';
        out.rows.push(row('누른 순간 체력', hpTxt(me.hp), 'bad'));
        out.rows.push(row('강타 피해량', S.fmt(dmg)));
      } else {
        stat.grade = out.grade = 'miss';
        out.title = '💀 MISS';
        out.sub = '체력이 0이 될 때까지 누르지 않았습니다';
        if (late) out.rows.push(row('내 강타', `${S.sec(late.sec)} 늦음`, 'bad'));
      }
      out.note = 'PERFECT 0.200초 이하 · GREAT 0.280초 · GOOD 0.400초';
    }
    out.stat = stat;
    return out;
  }

  function showResult(out) {
    const G = out.grade && S.GRADES[out.grade];
    const s = S.Store.stats;
    el.result.innerHTML = `
      <div class="result-card ${out.cls}">
        <div class="result-title">${out.title}</div>
        <div class="result-sub">${out.sub}</div>
        ${G ? `<div class="grade ${G.cls}">${G.label}<small>${G.ko}</small></div>` : ''}
        <dl class="result-rows">${out.rows.map(r => `<div class="${r.cls}"><dt>${r.k}</dt><dd>${r.v}</dd></div>`).join('')}</dl>
        ${out.note ? `<p class="result-note">${out.note}</p>` : ''}
        <div class="result-streak">🔥 연속 성공 <b>${s.streak}</b> · 최고 ${s.bestStreak}</div>
        <div class="result-actions">
          <button class="btn primary" data-act="retry">다시 하기<kbd>SPACE</kbd></button>
          <button class="btn" data-act="menu">메뉴<kbd>ESC</kbd></button>
        </div>
      </div>`;
    el.result.classList.add('show');
    el['streak-chip'].textContent = '🔥 ' + s.streak;
    resultAt = performance.now();
    S.Sound.play(out.cls === 'win' ? 'success' : 'fail');
  }

  function stop() {
    timers.forEach(clearTimeout);
    timers = [];
    cancelAnimationFrame(raf);
    R = null;
  }

  return {
    init, start, stop, smite,
    retry() { if (performance.now() - resultAt > 450) start(lastMode); },   // 연타로 바로 넘어가는 것 방지
    resultOpen() { return !!R && R.state === 'done' && el.result.classList.contains('show'); },
    isPlaying() { return !!R && (R.state === 'countdown' || R.state === 'live'); },
  };
})();

/* =====================================================================
   9. Screens — 메뉴 · 기록 · 설정
   ===================================================================== */
S.Screens = (function () {
  const $ = id => document.getElementById(id);
  const monName = id => id === 'random' ? '🎲 랜덤' : S.MONSTERS[id].icon + ' ' + S.MONSTERS[id].ko;
  const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '-';
  const avgErr = b => b.errorCount ? Math.round(b.errorSum / b.errorCount) + ' HP' : '-';

  function renderMenu() {
    const st = S.Store.settings, s = S.Store.stats;
    $('menu-status').innerHTML =
      `<span>${monName(st.monster)}</span><span>⚡ 강타 ${st.smiteDamage}</span><span>${S.DIFFICULTY[st.difficulty].label}</span>` +
      (s.total ? `<span>성공률 ${pct(s.success, s.total)}</span>` : '');
  }

  function renderStats() {
    const s = S.Store.stats;
    const card = (label, value, sub, hl) => `<div class="stat-card${hl ? ' hl' : ''}"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
    const avgR = s.reactionCount ? (s.reactionSum / s.reactionCount).toFixed(3) + '초' : '-';

    let html = `<div class="stat-grid">
      ${card('총 게임', s.total, `성공 ${s.success} · 실패 ${s.fail}`)}
      ${card('강타 성공률', pct(s.success, s.total), '', true)}
      ${card('평균 반응속도', avgR, s.bestReaction != null ? '최고 ' + s.bestReaction.toFixed(3) + '초' : '')}
      ${card('평균 강타 오차', avgErr(s), s.bestError != null ? '최소 ' + s.bestError + ' HP' : '')}
      ${card('스틸 성공', s.steals, '강타 싸움 승리')}
      ${card('최고 연속 성공', s.bestStreak + '회', '현재 ' + s.streak + '회', true)}
      ${card('PERFECT', s.perfect, '')}
      ${card('선택한 난이도', S.DIFFICULTY[S.Store.settings.difficulty].label, '')}
    </div>`;

    const table = (title, keys, labelOf, map) => {
      const rows = keys.filter(k => map[k]).map(k => {
        const b = map[k];
        return `<tr><td>${labelOf(k)}</td><td>${b.played}</td><td>${pct(b.success, b.played)}</td><td>${avgErr(b)}</td><td>${b.bestError != null ? b.bestError + ' HP' : '-'}</td></tr>`;
      }).join('');
      return `<section><h3>${title}</h3>${rows
        ? `<table class="tbl"><tr><th></th><th>플레이</th><th>성공률</th><th>평균 오차</th><th>최소 오차</th></tr>${rows}</table>`
        : '<div class="empty">아직 기록이 없습니다</div>'}</section>`;
    };
    html += table('모드별 기록', Object.keys(S.MODES), k => S.MODES[k], s.modes);
    html += table('몬스터별 기록', Object.keys(S.MONSTERS), monName, s.monsters);

    const hist = s.history.slice(0, 12).map(h => {
      const G = h.grade && S.GRADES[h.grade];
      const val = h.mode === 'reaction' && h.reaction != null ? h.reaction.toFixed(3) + '초'
                : h.error != null ? '오차 ' + h.error + ' HP' : '';
      return `<li><span>${h.success ? '✅' : '❌'}</span>
        <span class="h-main">${S.MODES[h.mode]} · ${S.MONSTERS[h.monster] ? S.MONSTERS[h.monster].ko : ''} · ${S.DIFFICULTY[h.difficulty] ? S.DIFFICULTY[h.difficulty].label : ''}</span>
        <span class="h-val">${val}</span>${G ? `<b class="${G.cls}" style="font-size:12px">${G.label}</b>` : ''}</li>`;
    }).join('');
    html += `<section><h3>최근 기록</h3>${hist ? `<ul class="hist">${hist}</ul>` : '<div class="empty">게임을 플레이하면 여기에 쌓입니다</div>'}</section>`;
    html += `<section><button class="danger-btn" id="btn-reset">기록 초기화</button></section>`;
    $('stats-body').innerHTML = html;

    // 실수로 지우지 않도록 두 번 눌러야 초기화 (브라우저 confirm 창 대신)
    const btn = $('btn-reset');
    let armTimer = 0;
    btn.onclick = () => {
      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        btn.textContent = '한 번 더 누르면 모두 삭제';
        armTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '기록 초기화'; }, 3000);
        return;
      }
      clearTimeout(armTimer);
      S.Store.reset();
      renderStats();
    };
  }

  function renderSettings() {
    const st = S.Store.settings;
    const chip = (attr, value, on, label, sub) =>
      `<button class="chip-btn${on ? ' on' : ''}" ${attr}="${value}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;

    $('settings-body').innerHTML = `
      <div class="set-block">
        <h3>강타 피해량</h3>
        <div class="chips">${S.SMITE.presets.map(v => chip('data-dmg', v, st.smiteDamage === v, v)).join('')}</div>
        <div class="range-row">
          <input type="range" id="set-dmg" min="${S.SMITE.min}" max="${S.SMITE.max}" step="${S.SMITE.step}" value="${st.smiteDamage}">
          <output id="set-dmg-val">${st.smiteDamage}</output>
        </div>
        <p class="set-help">몬스터 체력이 이 값 <b>이하</b>일 때 강타하면 처치합니다. 상대 정글러도 같은 피해량을 씁니다.</p>
      </div>
      <div class="set-block">
        <h3>난이도</h3>
        <div class="chips">${Object.keys(S.DIFFICULTY).map(k => chip('data-diff', k, st.difficulty === k, S.DIFFICULTY[k].label, S.DIFFICULTY[k].ko)).join('')}</div>
        <p class="set-help">${S.DIFFICULTY[st.difficulty].desc}</p>
      </div>
      <div class="set-block">
        <h3>몬스터</h3>
        <div class="chips">${Object.keys(S.MONSTERS).map(k => chip('data-mon', k, st.monster === k, monName(k), S.fmt(S.MONSTERS[k].maxHp) + ' HP')).join('')}
          ${chip('data-mon', 'random', st.monster === 'random', monName('random'), '매 판 무작위')}</div>
      </div>
      <div class="set-block">
        <label class="switch"><span>🔊 사운드</span><input type="checkbox" id="set-sound" ${st.sound ? 'checked' : ''}></label>
      </div>`;

    const body = $('settings-body');
    body.onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.dmg) st.smiteDamage = +b.dataset.dmg;
      else if (b.dataset.diff) st.difficulty = b.dataset.diff;
      else if (b.dataset.mon) st.monster = b.dataset.mon;
      else return;
      S.Store.saveSettings();
      renderSettings();
    };
    const range = $('set-dmg');
    range.oninput = () => { $('set-dmg-val').textContent = range.value; };
    range.onchange = () => { st.smiteDamage = +range.value; S.Store.saveSettings(); renderSettings(); };
    $('set-sound').onchange = e => { st.sound = e.target.checked; S.Store.saveSettings(); if (st.sound) S.Sound.play('count'); };
  }

  return { renderMenu, renderStats, renderSettings };
})();

/* =====================================================================
   10. App — 화면 전환 · 입력 (PC: SPACE / 모바일: 강타 버튼)
   ===================================================================== */
S.App = (function () {
  let current = 'menu';
  const RENDER = { menu: S.Screens.renderMenu, stats: S.Screens.renderStats, settings: S.Screens.renderSettings };

  function show(name) {
    current = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
    if (RENDER[name]) RENDER[name]();
    // 포커스된 버튼이 SPACE에 같이 반응하지 않도록
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function quit() { S.Game.stop(); show('menu'); }

  // 이벤트 발생 시각(performance.now 기준). 이상한 값이면 현재 시각으로 대체.
  function stamp(e) {
    const now = performance.now(), ts = e && e.timeStamp;
    return ts && ts <= now + 5 && ts > now - 3000 ? ts : now;
  }

  function onKey(e) {
    if (e.code === 'Space' || e.key === ' ') {
      if (current !== 'game') return;
      e.preventDefault();
      if (e.repeat) return;
      if (S.Game.resultOpen()) S.Game.retry();
      else S.Game.smite(stamp(e));
    } else if (e.key === 'Enter' && current === 'game' && S.Game.resultOpen()) {
      e.preventDefault();
      S.Game.retry();
    } else if (e.key === 'Escape' && current !== 'menu') {
      quit();
    }
  }

  function boot() {
    S.FX.init();
    S.Game.init();

    document.addEventListener('click', e => {
      const m = e.target.closest('[data-mode]');
      if (m) return S.Game.start(m.dataset.mode);
      const g = e.target.closest('[data-go]');
      if (g) return show(g.dataset.go);
      const a = e.target.closest('[data-act]');
      if (a) return a.dataset.act === 'retry' ? S.Game.retry() : quit();
    });
    document.getElementById('btn-quit').addEventListener('click', quit);

    // pointerdown: click보다 빨리 반응 (손을 뗄 때까지 기다리지 않음)
    const btn = document.getElementById('btn-smite');
    btn.addEventListener('pointerdown', e => { e.preventDefault(); S.Game.smite(stamp(e)); });
    btn.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', onKey);
    document.addEventListener('keyup', e => { if (current === 'game' && e.code === 'Space') e.preventDefault(); });

    // 브라우저 정책상 첫 입력 때 오디오를 켠다
    const unlock = () => { S.Sound.unlock(); window.removeEventListener('pointerdown', unlock, true); window.removeEventListener('keydown', unlock, true); };
    window.addEventListener('pointerdown', unlock, true);
    window.addEventListener('keydown', unlock, true);

    // 탭을 벗어나면 진행 중인 라운드는 취소 (돌아왔을 때 이미 끝나 있는 상황 방지)
    document.addEventListener('visibilitychange', () => { if (document.hidden && S.Game.isPlaying()) quit(); });

    show('menu');
  }

  return { boot, show };
})();

S.App.boot();
</script>
</body>
</html>
